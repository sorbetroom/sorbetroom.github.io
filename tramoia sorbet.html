<title>Tramóia - sorbet</title>

<style>
/* Layout: cena congelada em pixel art (480×270, escala inteira) no topo, caderno de palavras fixo embaixo,
   janelas de detalhe e dossiê como camadas por cima. Toda a interface usa o mesmo grão (--u = 1 pixel de UI)
   e a fonte bitmap da organização. Visual único noturno, por escolha. */
:root{
  --u:3px; --bankh:0px;
  --ink:#0b0a14; --night:#15132a; --plate:#1d1a33; --rim:#4a4470;
  --text:#f1ece0; --dim:#8e8aa8; --gold:#ffcf6e; --paper:#eadcb8; --paper-ink:#2a2218;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font:12px/1.4 'Courier New',monospace}
#app{position:fixed;inset:0;background:var(--ink)}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;margin:0}
button:focus-visible{outline:var(--u) solid var(--gold);outline-offset:var(--u)}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.ptx{display:block;max-width:none}

/* ---------- molduras 9-slice em pixel ---------- */
.plate,.btn,.chip,.paper,.photo,.blank,.tab{border-style:solid;border-color:transparent;box-sizing:border-box;image-rendering:pixelated}
.plate{border-width:calc(var(--u)*5);border-image:var(--fr-plate) 5 fill / calc(var(--u)*5) repeat}
.paper{border-width:calc(var(--u)*7);border-image:var(--fr-paper) 7 fill / calc(var(--u)*7) repeat;color:var(--paper-ink)}
.photo{border-width:calc(var(--u)*4);border-image:var(--fr-photo) 4 fill / calc(var(--u)*4) repeat}
.btn{--fr:var(--fr-btn);display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);min-height:calc(var(--u)*17);padding:0 calc(var(--u)*3);border-width:calc(var(--u)*4);border-image:var(--fr) 4 fill / calc(var(--u)*4) repeat}
.btn:hover,.btn:focus-visible,.btn.on{--fr:var(--fr-btn-on)}
.btn:active{transform:translateY(var(--u))}
.btn.gold{--fr:var(--fr-gold)}
.btn.gold:hover,.btn.gold:focus-visible{--fr:var(--fr-gold-on)}
.btn .on-t{display:none}.btn:hover .on-t,.btn:focus-visible .on-t,.btn.on .on-t{display:block}.btn:hover .off-t,.btn:focus-visible .off-t,.btn.on .off-t{display:none}
.btn.gold .on-t{display:none!important}.btn.gold .off-t{display:block!important}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--u)*3);
  padding:calc(env(safe-area-inset-top,0px) + var(--u)*3) calc(env(safe-area-inset-right,0px) + var(--u)*3) 0 calc(env(safe-area-inset-left,0px) + var(--u)*3);pointer-events:none}
#hud>*{pointer-events:auto}
.case{display:flex;flex-direction:column;gap:var(--u);padding:0 var(--u)}
.hudbtns{display:flex;gap:calc(var(--u)*2)}
.hudbtns .btn{min-height:calc(var(--u)*15);padding:0 calc(var(--u)*2)}
#tag{position:absolute;pointer-events:none;padding:0 var(--u);z-index:3;transform:translate(-50%,calc(-100% - var(--u)*4))}

/* ---------- caderno de palavras ---------- */
#bank{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:calc(var(--u)*3);
  padding:calc(var(--u)*3) max(calc(var(--u)*3),env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + var(--u)*3) max(calc(var(--u)*3),env(safe-area-inset-left,0px));
  background:var(--dither) 0 0/calc(var(--u)*2) calc(var(--u)*2) repeat,#0b0a14e0;box-shadow:0 calc(var(--u)*-1) 0 var(--rim)}
#modeBtn{flex:none;min-width:calc(var(--u)*46)}
#chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:calc(var(--u)*2);max-height:calc(var(--u)*50);overflow-y:auto;scrollbar-width:thin}
#chips .empty{opacity:.8}
.count{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:var(--u)}
.chip{--fr:var(--fr-chip-nome);display:inline-flex;align-items:center;min-height:calc(var(--u)*11);padding:0 var(--u);border-width:calc(var(--u)*3);border-image:var(--fr) 3 fill / calc(var(--u)*3) repeat;touch-action:none;cursor:grab}
.chip[data-c="objeto"]{--fr:var(--fr-chip-objeto)}.chip[data-c="hora"]{--fr:var(--fr-chip-hora)}.chip[data-c="motivo"]{--fr:var(--fr-chip-motivo)}
.chip:hover,.chip.sel{transform:translateY(calc(var(--u)*-1));filter:brightness(1.25)}
.chip.sel{outline:var(--u) solid #fff;outline-offset:var(--u)}
.chip.dim{opacity:.35}
.chip.new{animation:chipIn .5s steps(5)}
@keyframes chipIn{0%{transform:scale(1.6);filter:brightness(3)}100%{transform:none;filter:none}}
.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg);filter:drop-shadow(var(--u) var(--u) 0 #0008)}
.fly{position:fixed;z-index:61;pointer-events:none;transition:transform .5s steps(10),opacity .5s steps(10)}

/* ---------- janela de detalhe ---------- */
.layer{position:absolute;left:0;right:0;top:0;bottom:var(--bankh);display:flex;align-items:center;justify-content:center;
  padding-block:calc(env(safe-area-inset-top,0px) + var(--u)*6) calc(var(--u)*4);padding-left:max(calc(var(--u)*5),env(safe-area-inset-left,0px));padding-right:max(calc(var(--u)*5),env(safe-area-inset-right,0px));box-sizing:border-box;z-index:10}
.shade{background:var(--dither) 0 0/calc(var(--u)*2) calc(var(--u)*2) repeat}
#panel .win{position:relative;width:min(calc(var(--u)*290),100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:calc(var(--u)*4);padding:calc(var(--u)*2)}
.whead{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*4)}
.x{flex:none;min-width:calc(var(--u)*15);padding:0}
.tabs{display:flex;flex-wrap:wrap;gap:calc(var(--u)*2)}
.tab{--fr:var(--fr-tab);min-height:calc(var(--u)*13);padding:0 calc(var(--u)*2);border-width:calc(var(--u)*3);border-image:var(--fr) 3 fill / calc(var(--u)*3) repeat;display:inline-flex;align-items:center}
.tab:hover,.tab.on{--fr:var(--fr-tab-on)}
.wbody{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*5);align-items:start}
.art{line-height:0}
.art canvas{display:block}
.txt{min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*3)}
.para{line-height:0;display:flex;flex-wrap:wrap;align-items:flex-end;row-gap:calc(var(--u)*2)}
.para .w{display:inline-block}
.para .br{flex-basis:100%;height:0}
.para .gap{flex-basis:100%;height:calc(var(--u)*3)}
.clue{display:inline-block;padding:0 0 var(--u);box-shadow:inset 0 calc(var(--u)*-1) 0 currentColor;cursor:pointer;color:var(--cc)}
.clue:hover{filter:brightness(1.3);transform:translateY(calc(var(--u)*-1))}
.clue.got{opacity:.55;box-shadow:none}
@media (max-width:620px){.wbody{grid-template-columns:minmax(0,1fr)}.art{justify-self:center}}

/* ---------- dossiê ---------- */
#dossier{z-index:9}
#dossier .folder{position:relative;width:min(calc(var(--u)*420),100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:calc(var(--u)*5);padding:calc(var(--u)*3)}
.dhead{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:calc(var(--u)*4);padding-right:calc(var(--u)*20)}
.dhead .x{position:absolute;right:0;top:0}
.dtabs .tab{--fr:var(--fr-dtab)}.dtabs .tab:hover,.dtabs .tab.on{--fr:var(--fr-dtab-on)}
.ports{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*62),1fr));gap:calc(var(--u)*5) calc(var(--u)*4)}
.port{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2);min-width:0}
.sent{display:flex;flex-direction:column;gap:calc(var(--u)*5)}
.sent .para{row-gap:calc(var(--u)*3)}
.blank{--fr:var(--fr-blank);display:inline-flex;align-items:center;justify-content:center;min-width:calc(var(--u)*40);min-height:calc(var(--u)*11);padding:0 var(--u);border-width:calc(var(--u)*3);border-image:var(--fr) 3 fill / calc(var(--u)*3) repeat;vertical-align:bottom;cursor:pointer}
.blank.sel{--fr:var(--fr-blank-sel)}
.blank.full{--fr:var(--fr-chip-nome)}.blank.full[data-c="objeto"]{--fr:var(--fr-chip-objeto)}.blank.full[data-c="hora"]{--fr:var(--fr-chip-hora)}.blank.full[data-c="motivo"]{--fr:var(--fr-chip-motivo)}
.blank.over{filter:brightness(1.4);transform:translateY(calc(var(--u)*-1))}
.blank.lock{cursor:default}
.port .blank{min-width:calc(var(--u)*56)}
.verdict{display:flex;align-items:center;gap:calc(var(--u)*3);min-height:calc(var(--u)*14)}
.stamp{position:absolute;right:calc(var(--u)*10);top:calc(var(--u)*18);pointer-events:none;transform:rotate(-9deg);animation:stamp .45s steps(6)}
@keyframes stamp{0%{transform:scale(2.4) rotate(-20deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:rotate(-9deg)}}
.shake{animation:shake .3s steps(6)}
@keyframes shake{25%{transform:translateX(calc(var(--u)*-2))}75%{transform:translateX(calc(var(--u)*2))}}

/* ---------- telas ---------- */
.screen{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;overflow-y:auto;box-sizing:border-box;
  padding-block:calc(env(safe-area-inset-top,0px) + var(--u)*8) calc(env(safe-area-inset-bottom,0px) + var(--u)*8);
  padding-left:max(calc(var(--u)*6),env(safe-area-inset-left,0px));padding-right:max(calc(var(--u)*6),env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*7);width:min(calc(var(--u)*300),100%);margin:auto}
.menu{display:flex;flex-direction:column;gap:calc(var(--u)*3);width:min(calc(var(--u)*120),100%)}
.menu .btn{width:100%}
#title{background:radial-gradient(ellipse at 50% 42%,transparent 30%,#05040ab0 100%);justify-content:center}
#title .tstack{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*9);width:min(calc(var(--u)*320),100%);margin:auto}
#title .tcase{display:flex;align-items:center;gap:calc(var(--u)*3)}
#title .tcase i{display:block;width:calc(var(--u)*14);height:var(--u);background:#8a1a22}
#tTag{width:100%;display:flex;justify-content:center}
#tlogo{line-height:0;filter:drop-shadow(0 0 calc(var(--u)*6) #000)}
#tlogo canvas{display:block}
.tmenu{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2)}
.tline{position:relative;display:flex;align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*2) calc(var(--u)*5);line-height:0}
.tline::before{content:"";position:absolute;inset:0;background:#8a1a22;transform:scaleX(0) skewX(-12deg);transform-origin:0 50%;transition:transform .16s steps(4)}
.tline:hover::before,.tline:focus-visible::before{transform:scaleX(1) skewX(-12deg)}
.tline>*{position:relative}
.tline .on-t{display:none}.tline:hover .on-t,.tline:focus-visible .on-t{display:block}.tline:hover .off-t,.tline:focus-visible .off-t{display:none}
.tline .car{width:calc(var(--u)*4);height:calc(var(--u)*7);background:#f2e8d8;visibility:hidden}
.tline:hover .car,.tline:focus-visible .car{visibility:visible;animation:car .8s steps(1) infinite}
@keyframes car{50%{opacity:0}}
.tline:focus-visible{outline:none}
#title .thint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*14);display:flex;justify-content:center;pointer-events:none;opacity:.75}
.logo{line-height:0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3)}
.card{width:min(calc(var(--u)*270),100%);display:flex;flex-direction:column;gap:calc(var(--u)*5);padding:calc(var(--u)*3)}
.card .row{display:flex;gap:calc(var(--u)*3);flex-wrap:wrap;justify-content:flex-end}
.foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*4);display:flex;justify-content:center;opacity:.8;pointer-events:none}
#splash{background:#000;z-index:40;cursor:pointer}
#splash img{width:min(60vw,calc(var(--u)*150));height:auto;animation:splash 2.2s steps(22) forwards}
@keyframes splash{0%{opacity:0}20%,75%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;bottom:calc(var(--bankh) + var(--u)*5);transform:translateX(-50%);z-index:25;pointer-events:none;opacity:0;transition:opacity .2s steps(3);padding:0 var(--u);max-width:calc(100% - var(--u)*12)}
#toast.on{opacity:1}
#panel .win,#dossier .folder{touch-action:pan-y;overscroll-behavior:contain}
.panarr{position:absolute;z-index:4;width:calc(var(--u)*16);height:calc(var(--u)*24);display:grid;place-items:center;transform:translateY(-50%);animation:panPulse 1.2s steps(2) infinite}
.panarr canvas{display:block}
#panL{left:max(calc(var(--u)*2),env(safe-area-inset-left,0px))}#panR{right:max(calc(var(--u)*2),env(safe-area-inset-right,0px))}
@keyframes panPulse{50%{opacity:.55}}
/* toque: alvos maiores, caderno em uma fileira que rola para o lado */
@media (pointer:coarse),(max-height:560px){
  #chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;align-items:center;touch-action:pan-x;scroll-snap-type:x proximity;scrollbar-width:none;padding-block:var(--u)}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:none;scroll-snap-align:start;touch-action:pan-x}
  #chips .empty{flex:none;white-space:nowrap}
}
@media (pointer:coarse){
  .chip{min-height:calc(var(--u)*17);padding:0 calc(var(--u)*2)}
  .x{min-width:calc(var(--u)*22);min-height:calc(var(--u)*22)}
  .tab{min-height:calc(var(--u)*18);padding:0 calc(var(--u)*3)}
  .blank{min-height:calc(var(--u)*16);min-width:calc(var(--u)*46)}
  .clue{padding:calc(var(--u)*2) 0 calc(var(--u)*2);margin-block:calc(var(--u)*-1)}
  .hudbtns .btn{min-height:calc(var(--u)*20);padding:0 calc(var(--u)*3)}
  #modeBtn{min-height:calc(var(--u)*20)}
  .tline{padding:calc(var(--u)*4) calc(var(--u)*6)}
}
.chip.cat{cursor:default;opacity:.9;--fr:var(--fr-tab)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
/* =====================================================================
   TRAMÓIA — investigação de cena congelada em pixel art.
   Caso 1: A Última Live.
   Camadas: DADOS / ESTADO / REGRAS / VISUAL (boas práticas da organização).
   ===================================================================== */

/* ============================ UTIL ============================ */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rnd = (a=1,b) => b===undefined ? Math.random()*a : a+Math.random()*(b-a);
function seeded(seed){ let s=0; for(const ch of String(seed)) s=(s*31+ch.charCodeAt(0))>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function hash2(i,j,s=0){ let h=Math.imul(i|0,374761393)^Math.imul(j|0,668265263)^Math.imul((s|0)+1,1274126177); h=Math.imul(h^(h>>>13),1103515245); h^=h>>>16; return (h>>>0)/4294967296; }
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const bayer = (x,y) => (BAYER[(y&3)*4+(x&3)]+.5)/16;
const D2R=Math.PI/180;
const store = {
  get(k,d){ try{ const v=localStorage.getItem('tramoia.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('tramoia.'+k, JSON.stringify(v)); }catch(e){} },
};

/* ============================ PIXEL ============================ */
function C4(r,g,b,a=255){ return ((Math.round(a)<<24)|(Math.round(b)<<16)|(Math.round(g)<<8)|Math.round(r))>>>0; }
function C(hex){
  if(typeof hex==='number') return hex>>>0;
  let s=hex.slice(1), a=255; if(s.length===8){ a=parseInt(s.slice(6),16); s=s.slice(0,6); }
  const v=parseInt(s,16); return C4((v>>16)&255,(v>>8)&255,v&255,a);
}
const RGBA = c => [c&255,(c>>>8)&255,(c>>>16)&255,c>>>24];
function CM(c1,c2,t){ const a=RGBA(C(c1)), b=RGBA(C(c2)); return C4(lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t),lerp(a[3],b[3],t)); }
function hexOf(c){ const [r,g,b]=RGBA(c); return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''); }

class Buf{
  constructor(w,h){ this.w=w|0; this.h=h|0; this.d=new Uint32Array(this.w*this.h); }
  set(x,y,c){ x=Math.floor(x); y=Math.floor(y); if(x<0||y<0||x>=this.w||y>=this.h||!c) return; this.d[y*this.w+x]=c; }
  get(x,y){ x=Math.floor(x); y=Math.floor(y); if(x<0||y<0||x>=this.w||y>=this.h) return 0; return this.d[y*this.w+x]; }
  rect(x,y,w,h,c){ for(let j=0;j<h;j++) for(let i=0;i<w;i++) this.set(x+i,y+j, typeof c==='function'?c(x+i,y+j):c); }
  line(x0,y0,x1,y1,c){ x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
    const dx=Math.abs(x1-x0), sx=x0<x1?1:-1, dy=-Math.abs(y1-y0), sy=y0<y1?1:-1; let e=dx+dy;
    for(let n=0;n<4000;n++){ this.set(x0,y0,c); if(x0===x1&&y0===y1) break; const e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} } }
  poly(pts,c){
    let minY=1e9,maxY=-1e9; for(const p of pts){ if(p[1]<minY)minY=p[1]; if(p[1]>maxY)maxY=p[1]; }
    const fn = typeof c==='function';
    for(let y=Math.floor(minY); y<=Math.ceil(maxY); y++){
      const sy=y+.5, xs=[];
      for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length];
        if((a[1]<=sy&&b[1]>sy)||(b[1]<=sy&&a[1]>sy)) xs.push(a[0]+(sy-a[1])/(b[1]-a[1])*(b[0]-a[0])); }
      xs.sort((p,q)=>p-q);
      for(let k=0;k+1<xs.length;k+=2){ const x0=Math.ceil(xs[k]-.5), x1=Math.floor(xs[k+1]-.5);
        for(let x=x0;x<=x1;x++) this.set(x,y, fn? c(x,y) : c); }
    }
  }
  ellipse(cx,cy,rx,ry,c){ for(let y=Math.floor(cy-ry-1);y<=Math.ceil(cy+ry+1);y++) for(let x=Math.floor(cx-rx-1);x<=Math.ceil(cx+rx+1);x++){ const dx=(x+.5-cx)/rx, dy=(y+.5-cy)/ry; if(dx*dx+dy*dy<=1) this.set(x,y, typeof c==='function'?c(x,y,dx,dy):c); } }
  disc(cx,cy,r,c){ this.ellipse(cx,cy,r,r,c); }
  capsule(x0,y0,x1,y1,r,c){
    const vx=x1-x0, vy=y1-y0, L=vx*vx+vy*vy||1;
    for(let y=Math.floor(Math.min(y0,y1)-r-1);y<=Math.ceil(Math.max(y0,y1)+r+1);y++) for(let x=Math.floor(Math.min(x0,x1)-r-1);x<=Math.ceil(Math.max(x0,x1)+r+1);x++){
      const px=x+.5-x0, py=y+.5-y0; const t=clamp((px*vx+py*vy)/L,0,1); const dx=px-vx*t, dy=py-vy*t; if(dx*dx+dy*dy<=r*r) this.set(x,y,c); }
  }
  blit(src,dx,dy){ for(let y=0;y<src.h;y++) for(let x=0;x<src.w;x++){ const c=src.d[y*src.w+x]; if(c>>>24) this.set(dx+x,dy+y,c); } }
  outline(col){
    const w=this.w,h=this.h,d=this.d,o=new Uint32Array(d);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=y*w+x; if(d[i]>>>24) continue;
      if((x>0&&d[i-1]>>>24)||(x<w-1&&d[i+1]>>>24)||(y>0&&d[i-w]>>>24)||(y<h-1&&d[i+w]>>>24)) o[i]=col; }
    this.d=o; return this;
  }
  bbox(){ let x0=this.w,y0=this.h,x1=-1,y1=-1; for(let y=0;y<this.h;y++) for(let x=0;x<this.w;x++) if(this.d[y*this.w+x]>>>24){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } return x1<0?null:{x0,y0,x1,y1}; }
  canvas(crop=true){
    let bb = crop? this.bbox() : {x0:0,y0:0,x1:this.w-1,y1:this.h-1}; if(!bb) bb={x0:0,y0:0,x1:0,y1:0};
    const w=bb.x1-bb.x0+1, h=bb.y1-bb.y0+1, out=new Uint32Array(w*h);
    for(let y=0;y<h;y++) out.set(this.d.subarray((y+bb.y0)*this.w+bb.x0,(y+bb.y0)*this.w+bb.x0+w), y*w);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(out.buffer),w,h),0,0);
    return {cv, x0:bb.x0, y0:bb.y0, w, h, data:out};
  }
}

<script>
/* ============================ ÁUDIO ============================ */
const SFX = {
  ctx:null, master:null, mus:null, noiseBuf:null, muted:store.get('muted',false), musT:0, musStep:0, timer:0,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; this.ctx=new AC();
      this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:.6; this.master.connect(this.ctx.destination);
      const len=this.ctx.sampleRate*2; this.noiseBuf=this.ctx.createBuffer(1,len,this.ctx.sampleRate); const d=this.noiseBuf.getChannelData(0); let b=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; b=b*.97+w*.03; d[i]=w*.5+b*4; }
      this.startAmbience(); this.startMusic();
    }catch(e){ this.ctx=null; }
  },
  setMuted(m){ this.muted=m; store.set('muted',m); if(this.master) this.master.gain.value=m?0:.6; },
  tone(f0,f1,dur,type='sine',vol=.3,delay=0,dest){ const c=this.ctx; if(!c) return; const t=c.currentTime+delay; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+.006); g.gain.exponentialRampToValueAtTime(.0008,t+dur); o.connect(g); g.connect(dest||this.master); o.start(t); o.stop(t+dur+.05); },
  noise(dur,vol=.3,freq=1200,ftype='lowpass',f1,delay=0,q=1){ const c=this.ctx; if(!c) return; const t=c.currentTime+delay; const s=c.createBufferSource(); s.buffer=this.noiseBuf; const f=c.createBiquadFilter(); f.type=ftype; f.frequency.setValueAtTime(freq,t); f.Q.value=q; if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur); const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur); s.connect(f); f.connect(g); g.connect(this.master); s.start(t,Math.random()); s.stop(t+dur+.05); },
  play(n){ if(!this.ctx||this.muted) return;
    switch(n){
      case 'hover': this.tone(1800,1800,.025,'square',.012); break;
      case 'open':  this.noise(.12,.12,2500,'bandpass',900,0,1.4); this.tone(420,620,.08,'triangle',.06); break;
      case 'close': this.noise(.09,.08,1800,'bandpass',600,0,1.4); break;
      case 'tab':   this.tone(700,700,.04,'triangle',.07); break;
      case 'collect': [880,1320,1760].forEach((f,i)=>this.tone(f,f,.22-i*.04,'triangle',.08,i*.05)); break;
      case 'place': this.noise(.04,.2,3000,'bandpass',1500,0,2); this.tone(520,380,.05,'square',.04); break;
      case 'pick':  this.tone(600,900,.05,'triangle',.06); break;
      case 'remove':this.tone(500,260,.07,'triangle',.06); break;
      case 'wrong': this.tone(180,150,.25,'sawtooth',.05); this.tone(185,150,.25,'sawtooth',.04); break;
      case 'partial': this.tone(660,660,.14,'triangle',.07); this.tone(550,550,.22,'triangle',.07,.14); break;
      case 'solved': [523,659,784,1047].forEach((f,i)=>this.tone(f,f,.9-i*.1,'triangle',.08,i*.09)); this.noise(.18,.45,500,'lowpass',90,.42); this.tone(90,45,.25,'sine',.4,.42); break;
      case 'shutter': this.noise(.03,.5,6000,'highpass'); this.noise(.06,.3,2500,'bandpass',800,.05,2); this.tone(2400,2400,.02,'square',.03,.04); break;
      case 'mode':  this.noise(.22,.12,500,'bandpass',2600,0,1.2); break;
      case 'ui':    this.tone(880,880,.04,'triangle',.08); break;
    } },
  startAmbience(){ const c=this.ctx; const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true; const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=320; const g=c.createGain(); g.gain.value=.05; s.connect(f); f.connect(g); g.connect(this.master); s.start(); },
  /* trilha: acordes noir em pad suave + pinceladas de piano elétrico (agendadas com antecedência) */
  startMusic(){ const c=this.ctx; this.mus=c.createGain(); this.mus.gain.value=.5; const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1400; this.mus.connect(lp); lp.connect(this.master);
    this.musT=c.currentTime+.2; this.timer=setInterval(()=>this.sched(),180); },
  sched(){ const c=this.ctx; if(!c) return; const beat=60/68; const CH=[[50,53,57,60,64],[46,50,53,57,62],[43,50,53,58,62],[45,49,52,55,61]];
    const mt=m=>440*Math.pow(2,(m-69)/12);
    while(this.musT<c.currentTime+1.2){ const st=this.musStep, ch=CH[Math.floor(st/8)%4], t=this.musT-c.currentTime;
      if(st%8===0) ch.forEach((m,i)=>{ this.pad(mt(m),t,beat*8.2,i===0?.05:.028); });
      if(st%2===0 && hash2(st,7)<.55){ const m=ch[1+Math.floor(hash2(st,3)*4)]+12; this.tone(mt(m),mt(m),beat*1.6,'sine',.035,Math.max(0,t),this.mus); this.tone(mt(m)*2,mt(m)*2,beat*.4,'triangle',.008,Math.max(0,t),this.mus); }
      if(st%4===2){ this.tone(mt(ch[0]-12),mt(ch[0]-12),beat*1.8,'sine',.06,Math.max(0,t),this.mus); }
      this.musT+=beat; this.musStep++; } },
  pad(f,delay,dur,vol){ const c=this.ctx, t=c.currentTime+Math.max(0,delay); [0,6].forEach(det=>{ const o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.value=f; o.detune.value=det; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+dur*.3); g.gain.linearRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(this.mus); o.start(t); o.stop(t+dur+.1); }); },
};

/* ============================ RENDER: canvas nativo + WebGL ============================
   A cena é desenhada num canvas de 480×270 e ampliada por um fator inteiro (pixel exato).
   O WebGL só faz o pós: brilho das luzes (bloom), vinheta, grão de filme, flash da câmera e escurecimento. */
const VW=480, VH=270;
const screen=$('#screen');
const sc=document.createElement('canvas'); sc.width=VW; sc.height=VH; const cx=sc.getContext('2d'); cx.imageSmoothingEnabled=false;

      float l=max(c.r,max(c.g,c.b)); gl_FragColor=vec4(c*smoothstep(.72,1.,l),1.); }`;
  const BLUR=`precision mediump float; varying vec2 v; uniform sampler2D t; uniform vec2 d;
    void main(){ vec3 c=texture2D(t,v).rgb*.227; c+=(texture2D(t,v+d*1.385).rgb+texture2D(t,v-d*1.385).rgb)*.316; c+=(texture2D(t,v+d*3.231).rgb+texture2D(t,v-d*3.231).rgb)*.07; gl_FragColor=vec4(c,1.); }`;
  const FINAL=`precision mediump float; varying vec2 v;
    uniform sampler2D uScene,uBloom; uniform vec2 uVirt; uniform float uTime,uFlash,uFade,uDim,uBloomAmt,uSpotA,uSiren; uniform vec3 uSpot;
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 uv=v; vec2 cc=uv-.5; float asp=uVirt.x/uVirt.y;
      vec3 col=texture2D(uScene,uv).rgb;
      col+=texture2D(uBloom,uv).rgb*uBloomAmt;
      float vg=smoothstep(1.15,.35,length(cc*vec2(asp*.62,1.)));
      col*=mix(.72,1.,vg);
      vec2 cell=floor(uv*uVirt); float g=h(cell+floor(uTime*12.))-.5; col+=g*.025;
      float l=dot(col,vec3(.299,.587,.114));
      col=mix(col,vec3(l)*vec3(.9,.92,1.1),uDim*.55); col*=1.-uDim*.45;

        float e=smoothstep(uSpot.z,uSpot.z*.5,dist); float lit=step(h(c2+7.)*.92+.04,e); float rim=step(h(c2+3.)*.9,smoothstep(uSpot.z*1.5,uSpot.z,dist))*.1;
        col=mix(col, col*(max(lit,rim)+.035)*mix(vec3(1.),vec3(1.06,1.,.9),lit), uSpotA); }
      if(uSiren>0.){ float s=sin(uTime*2.6); vec3 sc=s>0.?vec3(.85,.08,.14):vec3(.12,.26,.95); col+=sc*abs(s)*uSiren*(1.-vg)*.32; }
      col=mix(col,vec3(1.,.98,.92),clamp(uFlash,0.,1.));
      col*=1.-uFade;
      gl_FragColor=vec4(col,1.);
    }`;
  function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function prog(fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.bindAttribLocation(p,0,'a'); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS); for(let i=0;i<n;i++){ const info=gl.getActiveUniform(p,i); u[info.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(p,info.name); } return {p,u}; }
  let pB,pBl,pF; try{ pB=prog(BRIGHT); pBl=prog(BLUR); pF=prog(FINAL); }catch(err){ console.warn('shader',err); return null; }
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

<script>
/* ============================ VISUAL: PERSONAGENS ============================

   piscada, gesto) são assados uma vez e guardados em cache. */
const OUTL=C('#181020');
const M=(l,b,s,d)=>[C(l),C(b),C(s),C(d)];
const MAT={
  shirt:M('#f4f0f8','#d2cee0','#9a9ab4','#5e5e7c'),   chinos:M('#e6cf9e','#bf9d6a','#8a6c46','#54402a'),
  sneaker:M('#f0f0f6','#cacad8','#9090a8','#56566e'), green:M('#a6dc8c','#55a060','#326c46','#1c402c'),

  red:M('#ff8e7a','#d8402e','#9a2420','#5a1414'),     apron:M('#a0826a','#6a4e3c','#483426','#2a1c14'),
  yellow:M('#fff2a4','#f4c43c','#c2861e','#7a4a14'),  jeans:M('#8eb2e4','#4c6cac','#304a7e','#1a2a4c'),
  orange:M('#ffb070','#e8702a','#a8481c','#602810'),  grey:M('#d0d0de','#8e8ea6','#5e5e76','#36364c'),
  heel:M('#5a5a70','#2a2838','#1a1824','#0e0c14'),    pink:M('#ffc4dc','#ff7aa8','#c84478','#7a2048'),
  wood:M('#8a5a40','#5e3a2a','#44281e','#2a1812'),    marble:M('#eeeaf4','#cdc6da','#9a92b0','#625a7a'),
  metal:M('#ffffff','#c8cede','#8a90a8','#4a5068'),   paper:M('#ffffff','#f4efe2','#cfc6b0','#8a826e'),
  cloth:M('#e8e4f0','#c6c0d6','#9690ae','#5c5876'),   glassB:M('#d0f0ff','#4a8aff','#2a50c0','#18307a'),
  leaf:M('#9ae07a','#4e9a4a','#2e6a3a','#183e24'),    pot:M('#e0a07a','#b0603e','#7a3a2a','#4a2018'),
  leatherG:M('#7ac08a','#3e7a52','#2a5a3c','#163224'), slab:M('#5a5a74','#2a2a3e','#1c1c2c','#101018'),
};
const SKIN={ a:M('#ffe0c4','#f2b48e','#c87c66','#8a4a44'), b:M('#f6c7a0','#d89670','#a8604e','#6e3a32'),
  c:M('#cf9468','#a86c46','#7a4630','#4a2a1e'), d:M('#9c6a4a','#744a32','#523224','#321e16') };
const HAIRM={ brown:M('#a0684a','#6a3c2a','#45241c','#2a1410'), black:M('#5a5070','#2a2236','#1a1424','#0e0a14'),
  grey:M('#eeeef6','#b4b4c8','#7a7a94','#4a4a60'), dark:M('#4a3a34','#2a1e1c','#1a1212','#0e0a0a') };
const WHITE=C('#f6f2ea'), LIP=C('#7a2a34');

class Fig{
  constructor(w,h,rot){ this.dw=w; this.dh=h; this.rot=!!rot; this.w=rot?h:w; this.h=rot?w:h; this.out=new Buf(this.w,this.h); }
  T(x,y){ return this.rot? [y, this.dw-1-x] : [x,y]; }
  part(mat,fn,o={}){
    const m=new Buf(this.dw,this.dh); fn(m); let mm=m;
    if(this.rot){ mm=new Buf(this.w,this.h); for(let y=0;y<this.dh;y++) for(let x=0;x<this.dw;x++) if(m.d[y*this.dw+x]){ const [X,Y]=this.T(x,y); mm.d[Y*this.w+X]=1; } }
    this.shade(mm,mat,o);
  }
  shade(m,mat,o){ const w=this.w,h=this.h,d=m.d; let x0=w,x1=-1;
    for(let i=0;i<d.length;i++) if(d[i]){ const x=i%w; if(x<x0)x0=x; if(x>x1)x1=x; }
    if(x1<0) return; const side=o.side===undefined?.66:o.side; const thr=side===false?1e9:x0+(x1-x0+1)*side;
    const In=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&d[y*w+x];
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(!d[y*w+x]) continue;
      let t=1; if(x>=thr) t=2; else if(x>=thr-1&&((x+y)&1)) t=2;
      const r=!In(x+1,y), dn=!In(x,y+1), l=!In(x-1,y), up=!In(x,y-1);
      if(r&&dn) t=3; else if(r||dn) t=Math.max(t,2); else if((l||up)&&t===1) t=0;
      if(o.noLight&&t===0) t=1;
      this.out.d[y*w+x]=mat[t]; }
  }
  px(x,y,c){ const [X,Y]=this.T(Math.round(x),Math.round(y)); this.out.set(X,Y,c); }
  is(x,y,mat){ const [X,Y]=this.T(Math.round(x),Math.round(y)); const c=this.out.get(X,Y); return mat.includes(c); }
  line(x0,y0,x1,y1,c){ const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1; for(let i=0;i<=n;i++) this.px(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n,c); }

}

/* braço em 2 segmentos por cinemática inversa: o cotovelo dobra para fora do corpo */
function ik(Sx,Sy,Tx,Ty,l1,l2,s,cx,bendIn){
  let dx=Tx-Sx, dy=Ty-Sy, d=Math.hypot(dx,dy)||1; const maxd=l1+l2-.01;
  if(d>maxd){ dx*=maxd/d; dy*=maxd/d; d=maxd; Tx=Sx+dx; Ty=Sy+dy; }
  const a=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1)), th=Math.atan2(dy,dx);
  const e1=[Sx+Math.cos(th+a)*l1, Sy+Math.sin(th+a)*l1], e2=[Sx+Math.cos(th-a)*l1, Sy+Math.sin(th-a)*l1];
  const s1=s*(e1[0]-cx)+(e1[1]-Sy)*.15, s2=s*(e2[0]-cx)+(e2[1]-Sy)*.15;
  const e=((s1>=s2)!==!!bendIn)?e1:e2;
  return {ex:e[0],ey:e[1],hx:Tx,hy:Ty};
}

/* ---- penteados: back (atrás da cabeça) e front (sobre a testa) ---- */
const HAIR={
  short:{ front(m,S){ const {cx,hy}=S; m.ellipse(cx,hy-3.5,8.3,6.2,(x,y)=>y<hy-2?1:0); m.rect(cx-8,hy-3,2,4,1); m.rect(cx+6,hy-3,2,3,1); m.rect(cx-5,hy-3,6,1,1); m.rect(cx-6,hy-2,3,1,1); } },
  bob:{ back(m,S){ const {cx,hy}=S; m.ellipse(cx,hy+1,9.6,10.2,(x,y)=>y<hy+8?1:0); },
        front(m,S){ const {cx,hy}=S; m.ellipse(cx,hy-3,8.5,6.4,(x,y)=>y<hy-1?1:0); m.poly([[cx-8,hy-5],[cx+3,hy-7],[cx-1,hy-2],[cx-7,hy+1]],1); m.rect(cx+6,hy-3,3,10,1); m.rect(cx-9,hy-3,3,11,1); } },
  long:{ back(m,S){ const {cx,hy,k}=S; const sw=[0,1,0,-1][k%4]; m.ellipse(cx,hy,9.6,10,1); m.poly([[cx-9.5,hy-1],[cx+9.5,hy-1],[cx+10+sw,hy+21],[cx-10+sw,hy+21]],1); },
         front(m,S){ const {cx,hy}=S; m.ellipse(cx,hy-3,8.5,6.6,(x,y)=>y<hy-1?1:0); m.rect(cx-7,hy-3,14,2,1); m.rect(cx-9,hy-3,3,15,1); m.rect(cx+6,hy-3,3,15,1); } },
  slick:{ front(m,S){ const {cx,hy}=S; m.ellipse(cx,hy-4,8.2,5.4,(x,y)=>y<hy-2?1:0); m.rect(cx-8,hy-3,2,5,1); m.rect(cx+6,hy-3,2,5,1); } },
  buzz:{ front(m,S){ const {cx,hy}=S; m.ellipse(cx,hy-4,7.9,5.2,(x,y)=>y<hy-3?1:0); m.rect(cx-8,hy-3,1,3,1); m.rect(cx+7,hy-3,1,3,1); } },
};

function face(S){
  const {F,cx,hy,sp}=S, sk=sp.skin, f=sp.face, gz=f.gaze||0, ey=hy+1, brow=sp.browC||sp.hairM[3];
  for(const ex of [cx-4,cx+2]){
    if(S.blink||f.closed){ F.px(ex,ey,sk[3]); F.px(ex+1,ey,sk[3]); continue; }
    F.px(ex,ey-1,OUTL); F.px(ex+1,ey-1,OUTL); F.px(ex,ey,WHITE); F.px(ex+1,ey,WHITE); F.px(ex+(gz>0?1:0),ey,OUTL);
    if(f.wide){ F.px(ex,ey+1,WHITE); F.px(ex+1,ey+1,WHITE); F.px(ex+(gz>0?1:0),ey+1,OUTL); }
  }
  const by=hy-2, B={ flat:[[0,0,0],[0,0,0]], worry:[[0,-1,-1],[-1,-1,0]], angry:[[-1,-1,0],[0,-1,-1]], up:[[-1,-1,-1],[-1,-1,-1]] }[f.brow||'flat'];
  [cx-5,cx-4,cx-3].forEach((x,i)=>F.px(x,by+B[0][i],brow)); [cx+2,cx+3,cx+4].forEach((x,i)=>F.px(x,by+B[1][i],brow));

  const my=hy+6;

    case 'o': F.px(cx-1,my,OUTL); F.px(cx,my,OUTL); F.px(cx-1,my+1,OUTL); F.px(cx,my+1,LIP); break;
    case 'O': for(let x=-1;x<=1;x++) for(let y=0;y<3;y++) F.px(cx+x,my+y,(x===0&&y===1)?LIP:OUTL); break;
    case 'smile': for(let x=-2;x<=1;x++) F.px(cx+x,my,sk[3]); F.px(cx-3,my-1,sk[3]); F.px(cx+2,my-1,sk[3]); break;
    case 'frown': for(let x=-2;x<=1;x++) F.px(cx+x,my,sk[3]); F.px(cx-3,my+1,sk[3]); F.px(cx+2,my+1,sk[3]); break;

function person(sp,fr={}){
  const W=48,H=80,cx=24,fy=78, b=fr.b||0, k=fr.k||0;
  const F=new Fig(W,H,sp.rot);
  const shY=31+b, hy=17+b;
  const S={F,sp,cx,fy,shY,hy,b,k,blink:!!fr.blink};
  const skin=sp.skin, st=sp.stance||0;

  if(sp.hairTip) sp.hairTip(S);
  // pernas, saia e sapatos
  if(sp.lower==='skirt'){ F.part(skin,m=>m.rect(cx-5-st,60,3,fy-62,1)); F.part(skin,m=>m.rect(cx+2+st,60,3,fy-62,1)); }
  else { F.part(sp.legs,m=>m.poly([[cx-7,51],[cx,51],[cx-1,fy-2],[cx-6-st,fy-2]],1),{side:.6}); F.part(sp.legs,m=>m.poly([[cx,51],[cx+7,51],[cx+6+st,fy-2],[cx+1,fy-2]],1),{side:.55}); }
  F.part(sp.shoes,m=>m.ellipse(cx-4-st,fy-1.5,3.6,2.1,1)); F.part(sp.shoes,m=>m.ellipse(cx+4+st,fy-1.5,3.6,2.1,1));
  if(sp.lower==='skirt') F.part(sp.legs,m=>m.poly([[cx-7,50],[cx+7,50],[cx+9,62],[cx-9,62]],1));
  // pescoço e tronco
  F.part(skin,m=>m.rect(cx-2,hy+6,5,Math.max(2,shY-hy-4),1),{side:.6});
  const tp = sp.build==='f' ? [[cx-8,shY],[cx+8,shY],[cx+6,shY+11],[cx+7,53],[cx-7,53],[cx-6,shY+11]]
           : sp.build==='big' ? [[cx-10,shY],[cx+10,shY],[cx+10,54],[cx-10,54]] : [[cx-9,shY],[cx+9,shY],[cx+8,53],[cx-8,53]];
  const sw=sp.build==='big'?9:sp.build==='f'?7:8;
  F.part(sp.top,m=>{ m.poly(tp,1); m.ellipse(cx-sw+.5,shY+2,3,3,1); m.ellipse(cx+sw-.5,shY+2,3,3,1); });
  if(sp.dress) sp.dress(S);
  // braços
  const arms={};
  const drawArm=s=>{ const t=sp.arms[s<0?'L':'R'](S); const Sx=cx+s*(sw-.5), Sy=shY+2; const a=ik(Sx,Sy,t[0],t[1],10,9,s,cx,t[2]);
    F.part(sp.sleeve||sp.top,m=>m.capsule(Sx,Sy,a.ex,a.ey,2.4,1),{side:.6}); F.part(sp.sleeve||sp.top,m=>m.capsule(a.ex,a.ey,a.hx,a.hy,2.1,1),{side:.6});
    F.part(skin,m=>m.disc(a.hx,a.hy,2.2,1),{side:.6}); arms[s<0?'L':'R']=a; };
  if(!sp.armsAfterHead){ drawArm(-1); drawArm(1); }
  // cabeça
  F.part(skin,m=>m.ellipse(cx-7.6,hy+1.5,1.6,2.2,1)); F.part(skin,m=>m.ellipse(cx+7.6,hy+1.5,1.6,2.2,1));
  F.part(skin,m=>m.ellipse(cx,hy,7.5,8.6,1));
  if(sp.beard) F.part(sp.hairM,m=>m.ellipse(cx,hy+4,7.4,5,(x,y)=>y>=hy+3?1:0),{side:.7});
  F.part(sp.hairM,m=>HAIR[sp.hair].front(m,S));
  face(S);
  if(sp.hat) sp.hat(S);
  if(sp.armsAfterHead){ drawArm(-1); drawArm(1); }
  if(sp.items) sp.items(S,arms);
  return F.done();
}

/* ---- elenco ---- */
const CAST={
  otavio:{ rot:true, skin:SKIN.a, hair:'short', hairM:HAIRM.brown, top:MAT.shirt, legs:MAT.chinos, shoes:MAT.sneaker, build:'m', stance:1,
    face:{closed:true,mouth:'o',brow:'flat'}, K:1,
    portrait:{ face:{mouth:'flat',brow:'flat'}, arms:{ L:S=>[S.cx-10,S.shY+19], R:S=>[S.cx+10,S.shY+19] } },
    arms:{ L:S=>[S.cx-7,S.shY-20], R:S=>[S.cx+10,S.shY+19] },
    dress(S){ const {F,cx,shY}=S; F.part(MAT.paper,m=>m.rect(cx+2,shY+6,5,6,1),{side:false}); for(let x=cx+2;x<cx+7;x++){ F.px(x,shY+6,C('#3a8aff')); F.px(x,shY+7,C('#3a8aff')); }
      F.px(cx-1,shY,MAT.shirt[3]); F.px(cx,shY+1,MAT.shirt[3]); F.px(cx+1,shY,MAT.shirt[3]); } },
  helena:{ skin:SKIN.a, hair:'bob', hairM:HAIRM.black, top:MAT.green, legs:MAT.black, shoes:MAT.heel, build:'f',
    face:{brow:'worry',mouth:'o',gaze:-1}, K:2,
    arms:{ L:S=>[S.cx-10,S.shY+19], R:S=>[S.cx+1+(S.k%2),S.shY+6] },
    dress(S){ const {F,cx,shY}=S; F.part(MAT.shirt,m=>m.poly([[cx-3,shY],[cx+3,shY],[cx,shY+10]],1),{side:false});
      F.line(cx-4,shY,cx-1,shY+11,MAT.green[3]); F.line(cx+4,shY,cx+1,shY+11,MAT.green[3]); F.px(cx,shY+14,MAT.green[3]); F.px(cx,shY+18,MAT.green[3]);
      F.line(cx-2,shY,cx-1,shY+12,C('#2a3a8a')); F.line(cx+2,shY,cx+1,shY+12,C('#2a3a8a'));
      F.part(MAT.paper,m=>m.rect(cx-2,shY+12,4,5,1),{side:false}); for(let x=cx-2;x<cx+2;x++) F.px(x,shY+12,C('#3a8aff')); } },
  caio:{ skin:SKIN.c, hair:'slick', hairM:HAIRM.grey, browC:HAIRM.grey[2], top:MAT.navy, legs:MAT.navy, shoes:MAT.heel, build:'big',
    face:{brow:'angry',mouth:'frown',gaze:-1,sweat:true}, K:2,

const SHEETS={};
function loadSheets(){ return Promise.all(Object.entries(SHEET_DATA).map(([id,m])=>new Promise(res=>{ const img=new Image(); img.onload=()=>{
    const c=document.createElement('canvas'); c.width=img.width; c.height=img.height; const g=c.getContext('2d'); g.drawImage(img,0,0);
    const frames=[]; for(let i=0;i<m.n;i++){ const d=g.getImageData(i*m.w,0,m.w,m.h).data, b=new Buf(m.w,m.h); for(let p=0;p<m.w*m.h;p++){ if(d[p*4+3]>128) b.d[p]=C4(d[p*4],d[p*4+1],d[p*4+2]); }
      b.outline(OUTL); const s=bake(b,m.w>>1,m.h); s.head=[m.head[i][0]-(m.w>>1)-s.ox, m.head[i][1]-m.h-s.oy]; frames.push(s); }
    SHEETS[id]=frames; res(); }; img.onerror=()=>res(); img.src=m.src; }))); }
function charFrame(id,fr){ const sh=SHEETS[id]; if(sh){ const n=sh.length; if(n===1) return sh[0]; return fr.blink ? sh[n-1] : sh[(fr.k||0)%(n-1)]; }
  const key=id+'|'+(fr.b||0)+'|'+(fr.blink?1:0)+'|'+(fr.k||0)+'|'+(fr.rot===false?0:1);
  if(!FRAMES[key]){ const sp=fr.rot===false?{...CAST[id],...(CAST[id].portrait||{}),rot:false}:CAST[id]; const b=person(sp,fr);
    FRAMES[key]= sp.rot ? bake(b,null,null) : bake(b,24,79); }
  return FRAMES[key]; }

/* ---- assar um Buf em sprite: canvas recortado, máscara de clique e contorno de destaque ---- */
const HL=C('#fff3c4');
function bake(buf,ax,ay){
  const r=buf.canvas(true); if(ax==null){ ax=r.x0+r.w/2|0; ay=r.y0+r.h; }
  const mask=new Uint8Array(r.w*r.h); for(let i=0;i<mask.length;i++) mask[i]=r.data[i]>>>24?1:0;
  const hb=new Buf(r.w+2,r.h+2), inn=(x,y)=>x>=0&&y>=0&&x<r.w&&y<r.h&&mask[y*r.w+x];
  for(let y=0;y<hb.h;y++) for(let x=0;x<hb.w;x++){ const X=x-1,Y=y-1; if(inn(X,Y)) continue; if(inn(X-1,Y)||inn(X+1,Y)||inn(X,Y-1)||inn(X,Y+1)) hb.d[y*hb.w+x]=HL; }
  return {cv:r.cv, w:r.w, h:r.h, ox:r.x0-ax, oy:r.y0-ay, mask, hl:hb.canvas(false).cv};
}

  const key=id+'|'+fr+'|'+(arg||''); if(!PROPCACHE[key]){ const r=PROPS[id](fr,arg); PROPCACHE[key]=bake(r.b,r.ax,r.ay); } return PROPCACHE[key]; }

<script>
/* ============================ VISUAL: CENÁRIO (cobertura à noite) ============================
   O fundo é assado pixel a pixel uma vez, com pontilhado granulado e halos de luz em faixas: céu, três camadas de prédios,
   guarda-corpo de vidro, casa de máquinas com o elevador aceso, deque de madeira iluminado
   por focos (luz quantizada em rampa com pontilhado) e a borda da piscina.
   Por cima, camadas vivas: água, lâmpadas do varal, janelas, estrelas, antena e avião. */
const POOL={ top:120, bot:164, tl:300, tr:468, bl:288, br:478 };
const LIGHTS=[ {x:60,y:156,r:78,i:.34,c:'w'}, {x:170,y:150,r:80,i:.36,c:'w'}, {x:262,y:160,r:70,i:.3,c:'w'}, {x:350,y:200,r:80,i:.26,c:'w'},
  {x:450,y:230,r:70,i:.22,c:'w'}, {x:40,y:122,r:46,i:.5,c:'w'}, {x:300,y:178,r:44,i:.36,c:'w'}, {x:384,y:150,r:96,i:.42,c:'c'}, {x:78,y:240,r:66,i:.3,c:'c'} ];
const AMB={ windows:[], stars:[], bulbs:[], pool:null };
let BG=null, POOLCV=null, POOLIMG=null;
const cat=(x0,y0,x1,y1,sag,x)=>{ const t=(x-x0)/(x1-x0); return lerp(y0,y1,t)+sag*4*t*(1-t); };
function wireY(x){ return x<250 ? cat(-10,30,250,22,26,x) : cat(250,22,490,30,24,x); }

/* ---- tratamento de pintura: pontilhado com granulado (mistura de ruído e Bayer), halos de luz em faixas,
   paleta terrosa dessaturada, veio na madeira e salpicos; objetos do fundo sem contorno ---- */
const grain=(x,y)=>hash2(x,y,91)*.6+bayer(x,y)*.4;
function rampAt(R,v,x,y){ let i=Math.floor(v); if(v-i>grain(x,y)) i++; return R[clamp(i,0,R.length-1)]; }
function halo(x,y,cx,cy,rx,ry){ const dx=(x-cx)/rx, dy=(y-cy)/ry; const d=Math.sqrt(dx*dx+dy*dy); return d>=1?0:Math.pow(1-d,.85); }
const speck=(x,y,s=7)=>{ const h=hash2(x,y,s); return h<.05?-1:h>.96?1:0; };
const RP=a=>a.map(C);
const PAL={
  sky:RP(['#0a0b17','#0e1020','#131529','#191a31','#201f38','#29243d','#332941','#3e2e44','#4a3346']),
  halo:RP(['#232445','#2d2c4d','#383556']),
  moon:RP(['#a89c88','#cfc2a6','#e8dcc0','#f6eed8']),
  bld:[RP(['#1a1b31','#1e2038','#23253f']),RP(['#14162a','#181a30','#1c1e36']),RP(['#0f1022','#121327','#15172c'])],
  win:['#d8a65a','#e8c47e','#b8804a','#c99a62','#7c9cb0'], winOff:'#24233b',
  conc:RP(['#16141f','#1e1b29','#272333','#312c3e','#3c3649','#4a4254','#5c4f5a','#77615c','#94785e']),
  lift:RP(['#7a4a2e','#9a623a','#bd8048','#d9a05e','#ecc27c','#f8dc9e']),
  steel:RP(['#3a3c4e','#4e5266','#6a6e84','#8c90a4']),
  wood:RP(['#110a0d','#190e13','#221319','#2d191d','#3a2021','#482825','#593129','#6c3c2d','#834a32','#9c5b39','#b46e40']),
  woodC:RP(['#0b1115','#0f181e','#132128','#182c34','#1e3a41','#27494f','#325a5d','#406c6a']),
  stone:RP(['#4a4658','#5e596c','#77728a','#938da2','#aaa4b6']),
  shelf:RP(['#120a0a','#1b100e','#261612','#331d16','#40251b']),
  chair:RP(['#4e4a60','#6a6580','#888299','#a49eb2']),
};
function bakeBG(){
  const B=new Buf(VW,VH), rng=seeded('aurora');
  // céu: degradê pontilhado, névoa quente sobre a cidade, halo largo da lua em faixas
  const mx=414, my=26;
  for(let y=0;y<106;y++) for(let x=0;x<VW;x++){
    let v=y/106*(PAL.sky.length-1); v+=halo(x,y,240,108,300,46)*1.2;
    let c=rampAt(PAL.sky,v,x,y);
    const h=halo(x,y,mx,my,34,34); if(h>0){ const hv=h*3.2-.4; if(hv>grain(x,y)) c=PAL.halo[clamp(Math.floor(hv),0,2)]; }
    B.set(x,y,c); }
  for(let i=0;i<60;i++){ const x=rng()*VW|0, y=rng()*66|0; if(Math.hypot(x-mx,y-my)<30) continue; const big=rng()<.15; B.set(x,y,C(big?'#e8e2f0':'#7c7ca6')); if(big){ B.set(x-1,y,C('#4a4a70')); B.set(x+1,y,C('#4a4a70')); B.set(x,y-1,C('#4a4a70')); B.set(x,y+1,C('#4a4a70')); } if(i<26) AMB.stars.push({x,y,p:rng()*6}); }
  for(let y=my-10;y<my+10;y++) for(let x=mx-10;x<mx+10;x++){ const dx=x+.5-mx, dy=y+.5-my, d=Math.hypot(dx,dy); if(d>=8.6) continue;
    const lit=2.6-(dx+dy*.6)/7.5; let c=rampAt(PAL.moon,lit,x,y); if(hash2(x,y,4)<.12&&d<7) c=PAL.moon[1]; B.set(x,y,c); }
  // cidade: três camadas chapadas com salpicos e janelas foscas
  const LAY=[{lit:.12,top:[52,82],wd:[14,30]},{lit:.2,top:[62,92],wd:[12,26]},{lit:.28,top:[72,98],wd:[16,36]}];
  LAY.forEach((L,li)=>{ const R=PAL.bld[li]; let x=-6+li*7; while(x<VW){ const w=Math.round(lerp(L.wd[0],L.wd[1],rng())), top=Math.round(lerp(L.top[0],L.top[1],rng()));
      const roof=rng()<.35, aw=Math.max(3,w*.4|0);
      for(let y=top-(roof?4:0);y<106;y++) for(let i=0;i<w;i++){ if(y<top&&(i<(w-aw>>1)||i>=(w-aw>>1)+aw)) continue; const X=x+i; B.set(X,y,R[clamp(1+speck(X,y,li+3)+(i===0?1:0),0,2)]); }
      if(li===2&&x>340&&x<380&&!AMB.antenna){ for(let y=top-26;y<top;y++) B.set(x+4,y,R[1]); AMB.antenna={x:x+4,y:top-27}; }
      for(let wy=top+3;wy<103;wy+=4) for(let wx=x+2;wx<x+w-2;wx+=3){ const on=rng()<L.lit; const col=on?pick(PAL.win,rng):PAL.winOff;
        B.set(wx,wy,C(col)); B.set(wx,wy+1,C(on?CM(col,'#1a1020',.35):PAL.winOff));
        if(rng()<.04&&AMB.windows.length<40) AMB.windows.push({x:wx,y:wy,col:pick(PAL.win,rng),off:PAL.winOff,p:rng()*40,per:8+rng()*30}); }
      x+=w+Math.round(rng()*3); } });
  // guarda-corpo: vidro esverdeado pontilhado, reflexos diagonais, corrimão de metal
  for(let y=88;y<104;y++) for(let x=0;x<VW;x++){ const streak=((x-y*.6+400)%64)<4; const t=streak?.26:.1; if(t>grain(x,y)*.6) B.set(x,y,CM(B.get(x,y),'#8aa8b8',t+.08)); }
  for(let x=0;x<VW;x++){ B.set(x,86,PAL.steel[3]); B.set(x,87,PAL.steel[2]); B.set(x,88,PAL.steel[0]); }
  for(let x=14;x<VW;x+=58) for(let y=86;y<104;y++){ B.set(x,y,PAL.steel[0]); B.set(x+1,y,PAL.steel[1]); }
  for(let x=0;x<VW;x++) for(let y=104;y<112;y++){ const v=y===104?5:y===105?4:y===111?0:2.4+speck(x,y)*.9; B.set(x,y,rampAt(PAL.conc,v,x,y)); }
  // deque: halos de luz em faixas, cone do elevador, veio da madeira e salpicos
  const rows=[]; { let y=112,h=3; while(y<VH){ rows.push([y,Math.round(h)]); y+=Math.round(h); h=3+(y-112)*.05; } }
  const WARM=[[60,156,92,54,.55],[170,150,96,56,.6],[262,160,84,48,.48],[350,206,94,52,.4],[450,232,84,46,.34],[300,182,56,32,.55]];
  const COOL=[[384,150,120,52,.6],[78,242,76,30,.42]];
  rows.forEach(([ry,rh],ri)=>{ const L=24+ri*3, off=hash2(ri,9)*L|0;
    for(let y=ry;y<Math.min(VH,ry+rh);y++) for(let x=0;x<VW;x++){
      let w=.14; for(const [cx,cy,rx,ryy,i] of WARM) w+=halo(x,y,cx,cy,rx,ryy)*i;
      if(y<178){ const t=(y-117)/60, xl=23-(y-117)*.55, xr=58+(y-117)*.55; if(x>=xl&&x<=xr) w+=.62*(1-t); }
      let c2=0; for(const [cx,cy,rx,ryy,i] of COOL) c2+=halo(x,y,cx,cy,rx,ryy)*i;
      const plank=Math.floor((x+off)/L), seam=((x+off)%L)===0;
      const vein=Math.sin((x+off)*.33+hash2(ri,plank,2)*9+Math.sin(x*.06+ri)*2.2)>.9;

  // piscina: borda de pedra

  for(let y=58;y<117;y++) for(let x=20;x<61;x++) B.set(x,y,rampAt(PAL.steel,1.4+(x<22?1:0),x,y));
  for(let y=61;y<117;y++) for(let x=23;x<58;x++){ const t=(y-61)/56; B.set(x,y, y>108? rampAt(PAL.lift,1.2,x,y) : rampAt(PAL.lift,4.8-t*2.6+speck(x,y)*.6,x,y)); }
  for(let y=61;y<117;y++){ for(let x=23;x<30;x++) B.set(x,y,rampAt(PAL.steel,x===23?3:1.8+(29-x)*.1,x,y)); for(let x=51;x<58;x++) B.set(x,y,rampAt(PAL.steel,x===51?3:1.6,x,y)); }

const WATER=RP(['#0c2630','#103440','#16444e','#1e5660','#2c6c72','#4a8a88','#9cc8b8']);
function drawPool(t){
  const P=POOL, w=P.br-P.bl+1, h=P.bot-P.top+1, d=new Uint32Array(POOLIMG.data.buffer);
  for(let y=0;y<h;y++){ const fy=y/h, xl=lerp(P.tl,P.bl,fy)-P.bl, xr=lerp(P.tr,P.br,fy)-P.bl;
    for(let x=0;x<w;x++){ if(x<xl||x>xr){ d[y*w+x]=0; continue; }
      const X=x+P.bl, Y=y+P.top;
      let v=Math.sin(X*.16+t*1.7+Math.sin(Y*.35+t*.8)*1.4)+Math.sin((X*.5+Y*1.6)*.09-t*1.2)*.8;
      v=1.8+v*.6+fy*1.5+(y<2?-1.2:0); v+=halo(X,Y,384,160,40,9)*2.4;
      let i=Math.floor(v); if(v-i>grain(X,Y)) i++; i=clamp(i,0,WATER.length-2); if(v>4.8&&((X+Y+Math.floor(t*6))%5===0)) i=WATER.length-1;
      d[y*w+x]=WATER[i]; } }
  const pc=POOLCV.getContext('2d'); pc.putImageData(POOLIMG,P.bl,P.top);
}

const IDB=new Uint8Array(VW*VH);

function objSprite(o,t){
  if(o.char){ const sp=CAST[o.char]; if(o.char==='otavio') return charFrame('otavio',{});
    const b = Math.sin((t+o.ph)*2.1)>.2 ? -1 : 0; const k = sp.K>1 ? Math.floor((t+o.ph)*(o.char==='bruno'?5:o.char==='julia'?2:1.6))%sp.K : 0;

function shadowAt(x,y,rx,ry){ cx.fillStyle='rgba(8,4,14,.45)'; for(let dy=-Math.ceil(ry);dy<=Math.ceil(ry);dy++){ const t=1-(dy*dy)/(ry*ry); if(t<0) continue; const w=Math.round(rx*Math.sqrt(t)); cx.fillRect(Math.round(x)-w,Math.round(y)+dy,w*2+1,1); } }

function drawScene(t){
  cx.drawImage(BG,0,0);
  // vida do céu
  for(const s of AMB.stars){ if(Math.sin(t*1.3+s.p*3)>.6) cx.fillStyle='#ffffff', cx.fillRect(s.x,s.y,1,1); }
  for(const w of AMB.windows){ const on=Math.floor((t+w.p)/w.per)%2===0; cx.fillStyle=on?w.col:w.off; cx.fillRect(w.x,w.y,1,2); }
  if(AMB.antenna&&(t%1.6)<.5){ cx.fillStyle='#ff3a4a'; cx.fillRect(AMB.antenna.x,AMB.antenna.y,2,2); cx.fillStyle='#ff8a90'; cx.fillRect(AMB.antenna.x,AMB.antenna.y,1,1); }
  { const pt=(t%46)/46, px=Math.round(500-pt*540), py=Math.round(16+pt*6); if(px>-10&&px<490){ cx.fillStyle='#3a3a58'; cx.fillRect(px,py,5,1); cx.fillStyle=(t%1)<.25?'#ff4a5a':'#ffffff'; cx.fillRect(px+(t%2<1?0:4),py,1,1); } }
  // elevador: luz que treme de leve
  if((t%7)<.08){ cx.fillStyle='rgba(60,30,10,.35)'; cx.fillRect(23,61,35,56); }
  drawPool(t); cx.drawImage(POOLCV,0,0);
  // reflexo do varal na água
  for(const b of AMB.bulbs) if(b.x>POOL.tl&&b.x<POOL.tr){ const ry=POOL.top+4+((b.x*3)%30)+Math.round(Math.sin(t*2+b.x)); cx.fillStyle='rgba(255,226,160,.5)'; cx.fillRect(b.x,ry,2,1); }
  // objetos em ordem de profundidade
  IDB.fill(0);
  const list=[...OBJS].sort((a,b)=>a.z-b.z);
  for(const o of list){
    const spr=objSprite(o,t);
    if(o.char&&o.char!=='otavio'&&o.char!=='bruno') shadowAt(o.x,o.y-1,11,2.5);
    if(o.char==='otavio') shadowAt(o.x+4,o.y-4,58,5);
    const dx=Math.round(o.x+spr.ox), dy=Math.round(o.y+spr.oy);
    cx.drawImage(spr.cv,dx,dy); LAST[o.id]={spr,dx,dy};
    if(o.hot){ const id=HOTIDX[o.hot], m=spr.mask, w=spr.w;
      for(let y=0;y<spr.h;y++){ const Y=dy+y; if(Y<0||Y>=VH) continue; for(let x=0;x<w;x++){ if(!m[y*w+x]) continue; const X=dx+x; if(X>=0&&X<VW) IDB[Y*VW+X]=id; } } }
  }

  for(const b of AMB.bulbs){ const f=Math.sin(t*3+b.p)+Math.sin(t*7.3+b.p*2)*.4; const on=f>-1.1;
    cx.fillStyle='#141020'; cx.fillRect(b.x,b.y-1,1,1); cx.fillStyle=on?b.c:'#6a4a3a'; cx.fillRect(b.x-1,b.y,2,2); if(on&&f>.6){ cx.fillStyle='#ffffff'; cx.fillRect(b.x-1,b.y,1,1); } }
  // toque: losango piscando sobre o que ainda não foi examinado
  if(COARSE&&G.mode==='explore'&&!G.panel&&Math.floor(t*2.2)%3!==2){ const done=new Set();
    for(const o of OBJS){ if(!o.hot||done.has(o.hot)||G.seen.includes(o.hot)||!LAST[o.id]) continue; done.add(o.hot); const L=LAST[o.id];
      const mx=Math.round(L.dx+L.spr.w/2), my=Math.max(4,L.dy-4+(Math.floor(t*3)%2));
      cx.fillStyle='#0b0a14'; cx.fillRect(mx-2,my-1,5,3); cx.fillRect(mx-1,my-2,3,5); cx.fillStyle='#ffcf6e'; cx.fillRect(mx-1,my,3,1); cx.fillRect(mx,my-1,1,3); } }
  // destaque do que está sob o cursor (todos os sprites do mesmo ponto)
  if(G.hover&&G.mode==='explore'){ const pulse=(Math.floor(t*4)%2)===0; cx.globalAlpha=pulse?1:.6;
    for(const o of OBJS) if(o.hot===G.hover&&LAST[o.id]){ const L=LAST[o.id]; cx.drawImage(L.spr.hl,L.dx-1,L.dy-1); }
    cx.globalAlpha=1; }
}
function hotAt(x,y,R=2){ if(x<0||y<0||x>=VW||y>=VH) return null; const id=IDB[y*VW+x]; if(id) return HOTS[id-1];
  // tolerância para alvos pequenos (maior no toque)
  for(let r=1;r<=R;r++) for(const [dx,dy] of [[r,0],[-r,0],[0,r],[0,-r]]){ const X=x+dx,Y=y+dy; if(X>=0&&Y>=0&&X<VW&&Y<VH&&IDB[Y*VW+X]) return HOTS[IDB[Y*VW+X]-1]; }
  return null; }

    if(G.mode!=='think') setMode('think');
    const cv=DRAG.src.querySelector('canvas'); const g=document.createElement('div'); g.className='chip ghost'; g.dataset.c=WORDS[DRAG.w].c; const c2=cv.cloneNode(); c2.getContext('2d').drawImage(cv,0,0); c2.style.cssText=cv.style.cssText; g.appendChild(c2); document.body.appendChild(g); DRAG.ghost=g; SFX.play('pick'); }
  if(DRAG.moved){ DRAG.ghost.style.left=e.clientX+'px'; DRAG.ghost.style.top=e.clientY+'px';
    document.querySelectorAll('.blank.over').forEach(b=>b.classList.remove('over')); const t=document.elementFromPoint(e.clientX,e.clientY); const bl=t&&t.closest('.blank'); if(bl&&!bl.classList.contains('lock')) bl.classList.add('over'); } }

function fillBlank(key,w){

  if(WORDS[w].c!==b.c){ SFX.play('wrong'); toast('Essa lacuna pede um '+CAT[b.c].lb+'.'); const el=document.querySelector(`.blank[data-key="${key}"]`); if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } return; }

  check(b.page); renderDossier(); renderBank();
}
function clearBlank(key){ const b=BLANKS[key]; if(!b||G.solved[b.page]) return; delete G.fills[key]; G.verdict[b.page]=null; SFX.play('remove'); save(); renderDossier(); renderBank(); }
function check(pid){
  const p=PAGES.find(x=>x.id===pid), bl=pageBlanks(p);
  if(bl.some(b=>!G.fills[b.key])){ G.verdict[pid]=null; return; }
  G.checks++; const wrong=bl.filter(b=>G.fills[b.key]!==b.ans).length;
  if(wrong===0){ buzz([30,60,30,60,80]); G.solved[pid]=true; G.verdict[pid]='ok'; save(); SFX.play('shutter'); setTimeout(()=>SFX.play('solved'),80); G.flash=.9; G.stampNew=pid; updateHud();

  else if(wrong<=2){ G.verdict[pid]='close'; SFX.play('partial'); }
  else { G.verdict[pid]='no'; SFX.play('wrong'); }
  save();
}

/* ---- logotipo TRAMÓIA: serifa de alto contraste rasterizada em pixel, sombreado de osso pontilhado,
   corte horizontal escuro, acento em vermelho, sombra cor de sangue seco ---- */
let LOGO=null;
const LOGO_FONT='"Playfair Display SC", "Bodoni 72", Didot, "Times New Roman", serif';
function logoCanvas(){ if(LOGO) return LOGO;
  const px=46, txt='TRAMÓIA', c=document.createElement('canvas'), g=c.getContext('2d'); g.font=`900 ${px}px ${LOGO_FONT}`;
  const sp=3, ws=[...txt].map(ch=>g.measureText(ch).width), W=Math.ceil(ws.reduce((a,b)=>a+b,0)+sp*(txt.length-1))+10, H=Math.ceil(px*1.45);
  c.width=W; c.height=H; g.font=`900 ${px}px ${LOGO_FONT}`; g.fillStyle='#fff'; let x=5; [...txt].forEach((ch,k)=>{ g.fillText(ch,Math.round(x),Math.round(px*1.18)); x+=ws[k]+sp; });
  const d=g.getImageData(0,0,W,H).data, M=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&d[(y*W+x)*4+3]>120;
  const rows=[]; for(let y=0;y<H;y++){ let n=0; for(let x=0;x<W;x++) if(M(x,y)) n++; rows.push(n); }
  const cap=rows.findIndex(n=>n>W*.18), base=H-1-[...rows].reverse().findIndex(n=>n>W*.18);
  const BONE=RP(['#3a302c','#6a5c52','#a2907c','#d2c2a4','#eee2c6','#fff8e6']), RED=RP(['#4a0a14','#8a1a22','#c8323a','#f06a5a']);
  const crack=Math.round(cap+(base-cap)*.6);
  const b=new Buf(W+6,H+6);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ if(!M(x,y)) continue; b.set(x+4,y+4,C('#2a0810')); }   // sombra deslocada
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ if(!M(x,y)) continue;
    let c2;
    if(y<cap-1){ c2=rampAt(RED,2.6-(y/(cap||1))*.8+(!M(x,y-1)?1:0),x,y); }
    else { const t=clamp((y-cap)/Math.max(1,base-cap),0,1); let v=4.4-t*3.2+speck(x,y,13)*.7; if(!M(x,y-1)) v=5; else if(!M(x+1,y)||!M(x,y+1)) v-=1.4; if(y===crack||y===crack+1&&hash2(x,y)<.4) v=.4; c2=rampAt(BONE,v,x,y); }
    b.set(x+1,y+1,c2); }
  b.outline(C('#05040a'));
  // traço vermelho sob o nome, com um vão
  const ly=base+6; for(let x=8;x<W-4;x++){ if(Math.abs(x-W*.62)<6) continue; b.set(x,ly,C('#8a1a22')); b.set(x,ly+1,C('#4a0a14')); }
  LOGO=b.canvas(true).cv; return LOGO; }

function endSplash(){ if(G.mode!=='splash') return; $('#splash').hidden=true; G.fade=1; G.fadeT=0; setMode('title'); }

/* ============================ LAÇO ============================ */
let last=performance.now(), saveT=0;
function frame(now){ const rdt=Math.min(.05,(now-last)/1000); last=now; G.rt+=rdt; G.t+=rdt;
  G.flash=Math.max(0,G.flash-rdt*2.2); G.fade=Math.max(G.fadeT??0,G.fade-rdt*1.6); G.dim+=((G.dimT||0)-G.dim)*Math.min(1,rdt*8);
  if(G.mode==='explore'||G.mode==='think'){ G.playT+=rdt; saveT+=rdt; if(saveT>5){ saveT=0; save(); } }
  // lanterna e luz de viatura na tela inicial
  const inTitle=G.mode==='title'; G.titleT=(G.titleT||0)+rdt;
  G.spotA=clamp((G.spotA||0)+(inTitle?rdt*1.4:-rdt*2.5),0,1); G.siren=lerp(G.siren||0,inTitle?.5:0,Math.min(1,rdt*2));
  if(!G.spot) G.spot={x:240,y:150};
  if(!G.spotTgt||G.rt-(G.spotMove||-9)>3.5){ const vx0=Math.max(0,-SR.x/SR.w*VW), vx1=Math.min(VW,(OUTW-SR.x)/SR.w*VW), cxv=(vx0+vx1)/2, ax=(vx1-vx0)*.36;
    G.spotTgt={x:cxv+ax*Math.sin(G.rt*.31),y:150+55*Math.sin(G.rt*.47+1)}; }
  const k=Math.min(1,rdt*5); G.spot.x+=(G.spotTgt.x-G.spot.x)*k; G.spot.y+=(G.spotTgt.y-G.spot.y)*k;
  const flick = inTitle&&G.titleT<1.1 ? (Math.sin(G.titleT*47)>.1||G.titleT>.85 ? 1 : .15) : 1;
  G.spotShow=G.spotA*flick;
  if(G.panTgt!=null){ PAN.f+=(G.panTgt-PAN.f)*Math.min(1,rdt*7); if(Math.abs(G.panTgt-PAN.f)<.002){ PAN.f=G.panTgt; G.panTgt=null; } applyPan(); }
  updateObjs(rdt); drawScene(G.t); present(); requestAnimationFrame(frame); }

function onResize(){ setUIScale(); refreshPX(); if(G.mode==='explore'||G.mode==='think') renderBank(); if(G.panel) renderPanel(); if(G.mode==='think') renderDossier(); if(G.mode==='title') renderTitle(); resize(); }
function start(){
  setupFrames(); setUIScale(); loadSave(); bakeBG(); resize(); setupInput();
  $('#splashImg').src=STUDIO_LOGO; G.fade=0; G.dimT=.5;
  setTimeout(endSplash,2200);
  addEventListener('resize',onResize);
  if(document.fonts&&document.fonts.load) document.fonts.load('900 46px "Playfair Display SC"').then(()=>{ LOGO=null; if(G.mode==='title') renderTitle(); }).catch(()=>{});
  // pré-assa os quadros dos personagens para não travar no primeiro segundo
  setTimeout(()=>{ for(const id in CAST){ if(id==='otavio'){ charFrame(id,{}); charFrame(id,{rot:false}); continue; } for(const b of [0,-1]) for(const bl of [false,true]) for(let k=0;k<CAST[id].K;k++) charFrame(id,{b,blink:bl,k}); charFrame(id,{rot:false}); } },30);
  requestAnimationFrame(frame);
  window.__test={ G, openSpot, collect, fillBlank, setMode, check, WORDS, BLANKS, PAGES, toScene, hotAt, OBJS, LAST };
}
