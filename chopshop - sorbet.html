<style>

  #wrap { height: 100%; display: flex; align-items: center; justify-content: center }

           -webkit-user-select: none; user-select: none; -webkit-touch-callout: none }
  #stage { position: relative; line-height: 0 }
  /* abertura do estúdio (a mesma do Porradinha): letreiro falhando que acende e depois é desligado */
  #splash { position: fixed; inset: 0; z-index: 10; background: #000; display: grid; place-items: center; cursor: pointer; transition: opacity .35s steps(5) }
  #splash.out { opacity: 0; pointer-events: none }
  #splash .wall { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(255,120,60,.16), transparent 55%); opacity: 0 }
  #splash.lit .wall { opacity: 1 }
  #splash .logo2 { position: relative; width: min(74vw, calc(62vh * 1.233), 640px); aspect-ratio: 535/434 }
  #splash .logo2 canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; image-rendering: pixelated; cursor: pointer }
  #splash .logo2 canvas.on { opacity: 1 }
  #splash .logo2 canvas.hot { filter: brightness(1.9) }
  #splash .logo2 canvas.ghost { opacity: .22; filter: brightness(.55) saturate(.6); transition: opacity .8s steps(8) }
  #splash .logo2 canvas.ghost.fade { opacity: 0 }
  #splash .skip { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: 0; right: 0; display: flex; justify-content: center; opacity: .5 }
  #splash .skip canvas { image-rendering: pixelated }
  /* tubo CRT por cima da abertura, como no Porradinha: linhas de varredura, vinheta, cantos do tubo e a faixa que rola */
  #splash .crt { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
  #splash .crt::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(0,0,0,.34) 0 1px, transparent 1px 3px); mix-blend-mode: multiply }
  #splash .crt::after { content: ""; position: absolute; inset: 0; border-radius: 30px; box-shadow: inset 0 0 90px rgba(0,0,0,.7), 0 0 0 120px #000 }
  #splash .crt .roll { position: absolute; left: 0; right: 0; height: 18%; background: linear-gradient(transparent, rgba(255,255,255,.045), transparent); animation: sproll 7s linear infinite }
  #splash .crt .flick { position: absolute; inset: 0; background: rgba(255,240,220,.025); animation: spflick .12s steps(2) infinite }
  #splash .logo2 { filter: drop-shadow(-1px 0 0 rgba(255,40,90,.45)) drop-shadow(1px 0 0 rgba(60,200,255,.4)) }
  @keyframes sproll { from { top: -20% } to { top: 110% } }
  @keyframes spflick { 50% { opacity: .4 } }
  @media (prefers-reduced-motion: reduce) { #splash .crt .roll, #splash .crt .flick { animation-duration: .01s } }
  #gl { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; display: none; image-rendering: auto }

<script>
'use strict';
/* =========================================================================
   CHOP SHOP (antes Corte Perfeito) — v0.5.0 (8 cortes da linguiça ao wagyu, skins de combo, faca que segue o mouse, menu F2)
   Canvas 2D em pixel art gerada em código. Duas telas: deitada (480x270) e em pé (270x480).
   ========================================================================= */
const VERSION = 'V0.12.0';
let mode = 'splash';  // 'splash' = abertura do estúdio, 'title' = menu inicial, 'game' = tábua
/* opções do jogo (separadas do save do progresso) */
const OPT_KEY = 'corteperfeito.opts.v1';
const OPT = Object.assign({ vol: 0.8, mus: 0.7, sfx: 0.9, shaders: true, shake: 1, kprop: true, hand: 'dir' }, (() => { try { return JSON.parse(localStorage.getItem(OPT_KEY) || '{}') || {}; } catch (e) { return {}; } })());

let W = 480, H = 270, PORTRAIT = false;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const wrap = document.getElementById('wrap');

/* ---------------- utilidades ---------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const r2 = v => Math.round(v * 100) / 100;
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const RGB = {};
function rgb(hex) {
  if (RGB[hex]) return RGB[hex];
  const n = parseInt(hex.slice(1), 16);
  return (RGB[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]);
}
function fmt(v) {
  const s = (Math.round(v * 100) / 100).toFixed(2);
  let [i, d] = s.split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return 'R$ ' + i + ',' + d;
}
const fmtS = v => fmt(v).replace(',00', '').replace('R$ ', '');
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
const inRect = (p, r) => !!r && p.x >= r.x && p.y >= r.y && p.x < r.x + r.w && p.y < r.y + r.h;

/* ---------------- paleta ---------------- */
const C = {
  ink: '#2a1a14', cream: '#fff6e0', paint: '#efe2c4', red: '#c7362f', blue: '#22407a',
  yellow: '#f6c431', yellowD: '#d9a21b', green: '#7fd65a', gold: '#ffd34d', orange: '#f08a3a',
  okGreen: '#2e8a2e', dim: '#9a8a70', wood: '#6e4526',
};
const MEAT = ['#f0a39b', '#e2777a', '#cf575f', '#b3404a', '#93303a', '#74242d'].map(rgb);
const CRUST = ['#8a4426', '#6e3420', '#552615', '#3f1c10'].map(rgb);
const GCRUST = ['#fff2b0', '#ffd34d', '#d9a21b', '#9a6e10'].map(rgb);
const FAT = ['#fbf0d6', '#f2dfb4', '#e3c690', '#cfa565', '#b07a38', '#8e5a26'].map(rgb);
const BONE = ['#f8f1e0', '#e4d8bb', '#c9b88f'].map(rgb);
const CUTM = ['#f6aaa2', '#ec8a85'].map(rgb);
const CUTF = rgb('#fff8e8');
const SAUS = ['#e8946e', '#c25e40', '#a8462e', '#84321f', '#5a1e14', '#f0c8a8', '#d98472'].map(rgb);

/* ---------------- fonte bitmap (placa pintada) ---------------- */
const FONT = {
  'A':['.###.','#...#','#...#','#####','#...#','#...#','#...#'],
  'B':['####.','#...#','#...#','####.','#...#','#...#','####.'],
  'C':['.###.','#...#','#....','#....','#....','#...#','.###.'],
  'D':['####.','#...#','#...#','#...#','#...#','#...#','####.'],
  'E':['#####','#....','#....','####.','#....','#....','#####'],
  'F':['#####','#....','#....','####.','#....','#....','#....'],
  'G':['.###.','#...#','#....','#.###','#...#','#...#','.###.'],
  'H':['#...#','#...#','#...#','#####','#...#','#...#','#...#'],
  'I':['###','.#.','.#.','.#.','.#.','.#.','###'],
  'J':['..###','...#.','...#.','...#.','#..#.','#..#.','.##..'],
  'K':['#...#','#..#.','#.#..','##...','#.#..','#..#.','#...#'],
  'L':['#....','#....','#....','#....','#....','#....','#####'],
  'M':['#...#','##.##','#.#.#','#.#.#','#...#','#...#','#...#'],
  'N':['#...#','##..#','#.#.#','#..##','#...#','#...#','#...#'],
  'O':['.###.','#...#','#...#','#...#','#...#','#...#','.###.'],

  'Q':['.###.','#...#','#...#','#...#','#.#.#','#..#.','.##.#'],
  'R':['####.','#...#','#...#','####.','#.#..','#..#.','#...#'],
  'S':['.####','#....','#....','.###.','....#','....#','####.'],
  'T':['#####','..#..','..#..','..#..','..#..','..#..','..#..'],
  'U':['#...#','#...#','#...#','#...#','#...#','#...#','.###.'],

  '3':['####.','....#','....#','.###.','....#','....#','####.'],

  ':':['.','#','.','.','.','#','.'],
  '+':['.....','..#..','..#..','#####','..#..','..#..','.....'],
  '-':['....','....','....','####','....','....','....'],
  '$':['..#..','.####','#.#..','.###.','..#.#','####.','..#..'],
  '%':['##..#','##..#','...#.','..#..','.#...','#..##','#..##'],
  '/':['....#','....#','...#.','..#..','.#...','#....','#....'],
  '×':['.....','#...#','.#.#.','..#..','.#.#.','#...#','.....'],
  '(':['.#','#.','#.','#.','#.','#.','.#'],
  ')':['#.','.#','.#','.#','.#','.#','#.'],
  "'":['#','#','.','.','.','.','.'],
  '"':['#.#','#.#','...','...','...','...','...'],
  '°':['.#.','#.#','.#.','...','...','...','...'],
  '@':['.###.','#...#','#.###','#.#.#','#.##.','#....','.###.'],
  '*':['.....','..#..','#####','.###.','.#.#.','#...#','.....'],
  '>':['#..','.#.','..#','.#.','#..','...','...'],
  '<':['..#','.#.','#..','.#.','..#','...','...'],
};
const ACC = { 'Á':['A','acute'],'À':['A','grave'],'Ã':['A','tilde'],'Â':['A','circ'],'É':['E','acute'],'Ê':['E','circ'],
  'Í':['I','acute'],'Ó':['O','acute'],'Õ':['O','tilde'],'Ô':['O','circ'],'Ú':['U','acute'],'Ç':['C','ced'] };
const ACCM = { acute:['...#.','..#..'], grave:['.#...','..#..'], tilde:['.##.#','#..#.'], circ:['..#..','.#.#.'], ced:['..#..','.#...'] };
const GL = { ' ': { w: 3, px: [] } };
function buildGlyph(rows) {
  let l = 99, r = -1;
  rows.forEach(row => { for (let i = 0; i < row.length; i++) if (row[i] === '#') { l = Math.min(l, i); r = Math.max(r, i); } });
  if (r < 0) { l = 0; r = 0; }
  const px = [];
  rows.forEach((row, y) => { for (let i = l; i <= r; i++) if (row[i] === '#') px.push([i - l, y]); });
  return { w: r - l + 1, px };
}
for (const ch in FONT) GL[ch] = buildGlyph(FONT[ch]);
function glyph(ch) {
  if (GL[ch]) return GL[ch];
  const a = ACC[ch];
  if (!a) return GL['?'];
  const base = GL[a[0]], m = ACCM[a[1]];
  const shift = Math.round((base.w - 1) / 2) - 2;
  const px = base.px.slice();
  m.forEach((row, j) => { for (let i = 0; i < 5; i++) if (row[i] === '#') px.push([i + shift, a[1] === 'ced' ? 7 + j : j - 2]); });
  return (GL[ch] = { w: base.w, px });
}
const TC = new Map();
function textImg(str, color, style, scale) {
  const key = str + '|' + color + '|' + style + '|' + scale;
  let t = TC.get(key); if (t) return t;
  const s = [...String(str).toUpperCase()].map(glyph);
  let w = 0; s.forEach((g, i) => { w += g.w + (i ? 1 : 0); });
  const pad = 1, cw = w + pad * 2, chh = 11 + pad * 2;
  const c = document.createElement('canvas'); c.width = Math.max(1, cw * scale); c.height = chh * scale;
  const g = c.getContext('2d');
  const pix = []; let x = 0;
  s.forEach(gg => { gg.px.forEach(([px, py]) => pix.push([x + px + pad, py + 2 + pad])); x += gg.w + 1; });
  g.fillStyle = C.ink;
  if (style === 'outline') { for (const [px, py] of pix) g.fillRect((px - 1) * scale, (py - 1) * scale, 3 * scale, 3 * scale); }
  else if (style === 'shadow') { for (const [px, py] of pix) g.fillRect((px + 1) * scale, (py + 1) * scale, scale, scale); }
  g.fillStyle = color;
  for (const [px, py] of pix) g.fillRect(px * scale, py * scale, scale, scale);
  t = { c, w, scale, pad };
  if (TC.size > 800) TC.clear();
  TC.set(key, t); return t;
}
function text(g, str, x, y, o = {}) {
  const sc = o.scale || 1, t = textImg(str, o.color || C.cream, o.style || 'none', sc);
  let dx = x - t.pad * sc;
  if (o.align === 'center') dx -= t.w * sc / 2; else if (o.align === 'right') dx -= t.w * sc;
  g.drawImage(t.c, Math.round(dx), Math.round(y - (2 + t.pad) * sc));
}

// brilho dentro das letras: a própria tipografia acende e um reflexo atravessa só os pixels dela
const SHN = document.createElement('canvas'), SHG = SHN.getContext('2d');
function letterShine(str, x, y, sc, t, a, lv) {
  if (!str || a <= 0) return;
  const ti = textImg(str, '#ffffff', 'none', sc), w = ti.c.width, h = ti.c.height;
  const dx = Math.round(x - ti.pad * sc - ti.w * sc / 2), dy = Math.round(y - (2 + ti.pad) * sc);
  if (SHN.width < w) SHN.width = w; if (SHN.height < h) SHN.height = h;
  SHG.clearRect(0, 0, w, h); SHG.globalCompositeOperation = 'source-over'; SHG.drawImage(ti.c, 0, 0);
  SHG.globalCompositeOperation = 'source-in';
  const per = 0.55, ph = ((Math.max(0, t) % per) / per), bx = -w * 0.3 + ph * w * 1.6, bw = Math.max(10, w * 0.22);
  const gr = SHG.createLinearGradient(bx - bw, 0, bx + bw, h * 0.6);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  SHG.fillStyle = gr; SHG.fillRect(0, 0, w, h); SHG.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = a * (0.18 + 0.03 * lv + 0.12 * Math.sin(t * 18));  // as letras pulsam acesas
  ctx.drawImage(ti.c, dx, dy);
  ctx.globalAlpha = a * 0.85; ctx.drawImage(SHN, 0, 0, w, h, dx, dy, w, h);  // reflexo correndo
  ctx.restore();
}

/* ---------------- áudio (WebAudio, tudo sintetizado) ---------------- */
const Sfx = {
  ctx: null, master: null, muted: false, nb: null, sizG: null, lastCoin: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      const a = this.ctx = new AC();
      this.master = a.createGain(); this.master.connect(a.destination);
      this.sfx = a.createGain(); this.sfx.connect(this.master);
      this.mus = a.createGain(); this.mus.connect(this.master);
      this.applyVol();
      const len = a.sampleRate; const b = this.nb = a.createBuffer(1, len, a.sampleRate);
      const d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource(); src.buffer = b; src.loop = true;
      const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200;
      const pk = a.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 7000; pk.gain.value = 6;
      const g = this.sizG = a.createGain(); g.gain.value = 0;
      src.connect(hp); hp.connect(pk); pk.connect(g); g.connect(this.sfx); src.start();
    } catch (e) { this.ctx = null; }
  },
  applyVol() {
    if (!this.master) return;
    this.master.gain.value = this.muted ? 0 : 0.55 * OPT.vol;
    this.sfx.gain.value = OPT.sfx; this.mus.gain.value = 0.6 * OPT.mus;
  },
  setMute(m) { this.muted = m; this.applyVol(); },
  tone(f, dur, type = 'triangle', vol = 0.2, f2 = null, delay = 0, dest = null) {
    const a = this.ctx; if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol, type, f1, f2 = null, q = 1, delay = 0, dest = null) {
    const a = this.ctx; if (!a) return;
    const t = a.currentTime + delay, s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
    s.buffer = this.nb; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f1, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(dest || this.sfx); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  },
  // gaita (acordeona): duas serras desafinadas, filtro e tremolo do fole
  gaita(f, dur, delay = 0, vol = 0.04) {
    const a = this.ctx; if (!a) return;
    const t = a.currentTime + delay, g = a.createGain(), lp = a.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2100; lp.Q.value = 0.7;
    [-8, 8].forEach(cents => { const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = cents; o.connect(lp); o.start(t); o.stop(t + dur + 0.12); });
    const sq = a.createOscillator(); sq.type = 'square'; sq.frequency.value = f / 2; const sg = a.createGain(); sg.gain.value = 0.25; sq.connect(sg); sg.connect(lp); sq.start(t); sq.stop(t + dur + 0.12);
    const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 5.6; lg.gain.value = vol * 0.18; lfo.connect(lg); lg.connect(g.gain); lfo.start(t); lfo.stop(t + dur + 0.12);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.035);
    g.gain.setValueAtTime(vol, t + Math.max(0.04, dur - 0.05)); g.gain.linearRampToValueAtTime(0, t + dur + 0.08);

function updateSalao(dt) {
  const Sa = SALAO, rush = 1 + 0.35 * Math.max(0, Sa.plates.length - 1);
  Sa.flash = Math.max(0, Sa.flash - dt);
  Sa.spawnT -= dt * rush;
  if (Sa.spawnT <= 0) { Sa.spawnT = rnd(0.6, 1.5); spawnCust(); }
  const vC = 62 * rush, vW = 88 * (1 + 0.15 * S.up.garcom) * rush;
  for (let i = Sa.custs.length - 1; i >= 0; i--) {
    const c = Sa.custs[i]; c.ph += dt;

    else if (c.state === 'wait') c.wt += dt;

}

/* ============================ ABERTURA DO ESTÚDIO ============================
   Logo da TWO OWT num fundo preto: acende falhando como letreiro de neon (o "two" firma primeiro,
   o "owt" engasga), segura, e é desligada de uma vez como um interruptor, com o brilho residual sumindo. */
function runSplash(done) {
  const sp = document.getElementById('splash'), img = new Image(), $id = id => document.getElementById(id);
  let finished = false; const timers = [];
  const T = (ms, fn) => timers.push(setTimeout(fn, ms));
  const finish = () => {
    if (finished) return; finished = true; timers.forEach(clearTimeout); removeEventListener('keydown', key, true);
    sp.classList.add('out'); setTimeout(() => { sp.hidden = true; }, 400); done && done();
  };
  const key = e => { if (!finished) { e.preventDefault(); e.stopImmediatePropagation(); finish(); } };
  sp.addEventListener('pointerdown', e => { e.stopPropagation(); }); sp.addEventListener('click', finish); addEventListener('keydown', key, true);
  // "pular" na mesma fonte de pixel do jogo
  const touch = matchMedia('(pointer: coarse)').matches, t0 = textImg(touch ? 'TOQUE PARA PULAR' : 'QUALQUER TECLA PARA PULAR', '#3a3048', 'none', 1).c;
  const sk = document.createElement('canvas'); sk.width = t0.width; sk.height = t0.height; sk.getContext('2d').drawImage(t0, 0, 0);
  const ks = innerWidth < 640 ? 2 : 3; sk.style.width = t0.width * ks + 'px'; sk.style.height = t0.height * ks + 'px'; $id('spSkip').appendChild(sk);
  img.onload = () => {
    const w = img.width, h = img.height, src = document.createElement('canvas'); src.width = w; src.height = h;
    const sx = src.getContext('2d'); sx.drawImage(img, 0, 0); const d = sx.getImageData(0, 0, w, h).data;
    const layer = (id, test) => { const cv = $id(id); cv.width = w; cv.height = h; const c = cv.getContext('2d'), o = c.createImageData(w, h); for (let i = 0; i < d.length; i += 4) { if (d[i + 3] && test(d[i], d[i + 1], d[i + 2])) { o.data[i] = d[i]; o.data[i + 1] = d[i + 1]; o.data[i + 2] = d[i + 2]; o.data[i + 3] = 255; } } c.putImageData(o, 0, 0); return cv; };
    const cream = layer('spCream', (r, g) => g > 150), orange = layer('spOrange', (r, g) => g < 150), ghost = layer('spGhost', () => true);
    const on = (cv, v) => cv.classList.toggle('on', v), lit = v => sp.classList.toggle('lit', v);
    const audible = () => { try { Sfx.init(); } catch (e) { } return Sfx.ctx && Sfx.ctx.state === 'running'; };
    const buzz = () => { if (audible()) { Sfx.tone(118, 0.06, 'sawtooth', 0.03); Sfx.noise(0.04, 0.05, 'highpass', 3000); } };
    // "two" acende falhando
    let t = 450; for (const [v, ms] of [[1, 70], [0, 110], [1, 45], [0, 260], [1, 90], [0, 70], [1, 0]]) { T(t, () => { on(cream, !!v); lit(!!v); if (v) buzz(); }); t += ms; }
    // "owt" engasga mais
    t = 1150; for (const [v, ms] of [[1, 40], [0, 90], [1, 35], [0, 380], [1, 120], [0, 80], [1, 30], [0, 140], [1, 0]]) { T(t, () => { on(orange, !!v); if (v) buzz(); }); t += ms; }
    // uma falha rápida enquanto segura
    T(2550, () => on(orange, false)); T(2620, () => on(orange, true));
    // desliga de vez: um estalo de brilho e a luz cai
    T(3350, () => { cream.classList.add('hot'); orange.classList.add('hot'); });
    T(3410, () => { on(cream, false); on(orange, false); lit(false); ghost.classList.add('ghost'); if (audible()) { Sfx.tone(1400, 0.03, 'square', 0.06, 600); Sfx.noise(0.05, 0.15, 'lowpass', 900); } });
    T(3480, () => ghost.classList.add('fade'));
    T(4500, finish);
  };
  try { Sfx.init(); } catch (e) { }
  img.onerror = finish; img.src = STUDIO_LOGO;
}

/* ---------------- tamanho da tela e laço principal ---------------- */
let scale = 1;
function relayout(portrait) {
  const had = !!BOARD;
  if (had) clearSalao();
  applyLayout(portrait);
  cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
  buildBG(); S.railKey = null; seedSalao(); sizePanel();
}
function resize() {
  const aw = wrap.clientWidth || innerWidth, ah = wrap.clientHeight || innerHeight;
  const portrait = ah > aw * 1.08;
  if (!BOARD || portrait !== PORTRAIT) relayout(portrait);
  const fit = Math.min(aw / W, ah / H);
  // escala inteira só quando quase não sobra borda; senão a tábua ocupa a tela toda
  scale = fit >= 1 && Math.floor(fit) / fit > 0.88 ? Math.floor(fit) : fit;
  cv.style.width = Math.floor(W * scale) + 'px';
  cv.style.height = Math.floor(H * scale) + 'px';
  // o shader do menu desenha na resolução real da tela (scanlines nítidas)
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  GLC.width = Math.max(1, Math.round(Math.floor(W * scale) * dpr)); GLC.height = Math.max(1, Math.round(Math.floor(H * scale) * dpr));
}
addEventListener('resize', resize);
load();
resize();
if (S.refund) toast('O FAQUEIRO MUDOU!', 'DEVOLVEMOS ' + fmt(S.refund));
let lastT = performance.now();
if (new URLSearchParams(location.search).has('nosplash')) { document.getElementById('splash').hidden = true; titleEnter(); }
else runSplash(titleEnter);
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (mode === 'splash') { /* a abertura cobre a tela */ }
  else if (mode === 'title') { titleUpdate(dt); if (mode === 'title') titleRender(); else render(); }
  else { update(dt); render(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ganchos para teste automatizado */
window.__CP = {
  S, M, SALAO, UPG, CUTS, PRICE, KNIVES,
  get L() { return { W, H, BOARD, PANEL, TABS, TRAY, PORTRAIT }; },
  ideal(ext = 10) {
    if (!S.rest || S.phase !== 'cutting') return null;
    const c = S.rest, ln = idealFor(S.pc, c.P, true, { x: c.cx, y: c.cy });
    return ln ? extend(ln, ext) : null;
  },
  cut(x1, y1, x2, y2, steps = 12) {
    M.down = true; M.inside = null; M.entry = null;
    let a = { x: x1, y: y1 };
    for (let i = 1; i <= steps; i++) { const b = { x: lerp(x1, x2, i / steps), y: lerp(y1, y2, i / steps) }; drag(a, b); a = b; }
    M.down = false; M.inside = null; M.entry = null;
    return S.last;
  },
  give(v) { S.money += v; S.shown = S.money; },
  buy(i) { buyUpgrade(i); }, menu(i) { menuClick(i); }, buyKnife: i => buyKnife(i), tab: i => openTab(i),
  own(id) { S.owned[id] = true; }, setKnife(k) { swapKnifeCombo(S.active, k); S.active = k; S.railKey = null; },
  auto(x, y) { autoTouch({ x, y }); },
  strike: (x, y) => strike(x, y), SKINDEF, knifeSrc: (id, f, k, pl) => knifeSrc(id, f, k, pl), equip: (c, id) => equipSkin(c, id), kprop: v => setKprop(v), DBG,
  save, railAmt, snapAmt, pendingMoney, perMinute,
  TI, TL: () => TL, FIRE, tiActivate: id => tiActivate(id), titleEnter, enterGame() { enterGame(); if (!window.__KEEP_INTRO) { S.intro = null; S.introDone = true; } }, backToTitle, tiActivate, tiPress, camSlash,
};
