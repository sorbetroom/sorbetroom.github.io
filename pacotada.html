  #splash .crt .roll { position: absolute; left: 0; right: 0; height: 18%; background: linear-gradient(transparent, rgba(255,255,255,.045), transparent); animation: sproll 7s linear infinite }
  #splash .crt .flick { position: absolute; inset: 0; background: rgba(255,240,220,.025); animation: spflick .12s steps(2) infinite }

  const g = c.getContext('2d');

  s.forEach(gg => { gg.px.forEach(([px, py]) => pix.push([x + px + pad, py + 2 + pad])); x += gg.w + gap; });
  g.fillStyle = C.ink;
  if (style === 'outline') { for (const [px, py] of pix) g.fillRect((px - 1) * scale, (py - 1) * scale, 3 * scale, 3 * scale); }
  else if (style === 'shadow') { for (const [px, py] of pix) g.fillRect((px + 1) * scale, (py + 1) * scale, scale, scale); }
  g.fillStyle = color;
  for (const [px, py] of pix) g.fillRect(px * scale, py * scale, scale, scale);

function rollTalents() {

    const tot = pool.reduce((a, t) => a + w(t), 0); let r = Math.random() * tot, i = 0;
    for (; i < pool.length; i++) { r -= w(pool[i]); if (r <= 0) break; }

  }
  return out;
}

/* ---------------- arte da vila ---------------- */
let TOWN = null;
const PAL = { gr: ['#2b2140', '#2e2446', '#30264a'], tuft: ['#2e4a5e', '#3a6070', '#24384c'], path: '#9a5040', pathL: '#b8644a', pathD: '#6e3830', water: ['#2a4a8a', '#3a64a8', '#5a8ac8'], pine: ['#1e3a4a', '#2a5262', '#3f7a7c', '#64b49a'] };
// artes enviadas: canvas criado já no tamanho certo e preenchido quando a imagem carrega
const PIMG = {};
function pimg(k) { if (PIMG[k]) return PIMG[k]; const d = PROP_IMG[k], c = mkC(d.w, d.h), im = new Image(); im.onload = () => c.getContext('2d').drawImage(im, 0, 0); im.src = d.d; return (PIMG[k] = c); }
let PROPN = 0;
const PROP_VAR = { rock: ['rocks', 'rockss'], rock2: ['rock2'], bush: ['bush', 'bushs', 'berry'], mush: ['mush'], barrel: ['barrel'], crate: ['crate'], dead: ['dead'], oak: ['oak'], log: ['log'], stump: ['stump'], flowers: ['flowers'], grass: ['grass'], fern: ['fern'] };
function pineArt(sz) {
  if (typeof PROP_IMG !== 'undefined') { const v = (PROPN++ % 2) ? 'pine2' : 'pine1'; return pimg(v + ['xs', 's', ''][clamp(sz, 0, 2)]); }
  return pineArtOld(sz);
}
function pineArtOld(sz) {
  const w = 10 + sz * 4, h = 16 + sz * 6;
  return spr(w, h, x => {
