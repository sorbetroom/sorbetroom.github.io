</style>

function stat(name){let add=0,mult=1;for(const n of ECO.nodes){if(n.stat!==name)continue;const l=rk(n.id);if(l<=0)continue;add+=n.amount*l;if(n.milestones)for(const m of n.milestones)if(l>=m)mult*=2;}return [add,mult];}
